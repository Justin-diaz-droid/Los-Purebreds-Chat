<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los-Purebreds-Chat</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue&family=Dancing+Script&family=Lobster&family=Orbitron&family=Pacifico&family=Press+Start+2P&family=Roboto+Mono&display=swap">
<style>
  :root{
    --bg:#000; --side:#1c1c1e; --line:#2c2c2e; --row:#2c2c2e; --accent:#0a84ff;
    --text:#fff; --muted:#8e8e93; --input:#1c1c1e; --me:#0a84ff; --peer:#2c2c2e;
  }
  body[data-theme="discord"]{
    --bg:#313338; --side:#2b2d31; --line:#1f2023; --row:#404249; --accent:#5865f2;
    --text:#dbdee1; --muted:#949ba4; --input:#383a40; --me:transparent; --peer:transparent;
  }
  body[data-theme="whatsapp"]{
    --bg:#0b141a; --side:#111b21; --line:#222d34; --row:#202c33; --accent:#00a884;
    --text:#e9edef; --muted:#8696a0; --input:#2a3942; --me:#005c4b; --peer:#202c33;
  }
  body[data-theme="whatsapp"] .bubble{border-radius:8px;padding:6px 10px}
  body[data-theme="whatsapp"] .pill{border-radius:8px;border:none}
  body[data-theme="whatsapp"] .av-sb{background:var(--accent)}
  #tray{position:relative}
  #emo-btn{font-size:22px;cursor:pointer;user-select:none}
  #emo-panel{display:none;flex-direction:column;position:absolute;bottom:62px;left:20px;background:var(--side);border:1px solid var(--line);border-radius:12px;padding:8px;width:320px;height:330px;gap:6px;z-index:6}
  #emo-q{width:100%;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--text)}
  #emo-tabs{display:flex;gap:2px;overflow-x:auto;flex-shrink:0}
  #emo-tabs span{font-size:18px;padding:3px 6px;border-radius:6px;cursor:pointer}
  #emo-tabs span.on,#emo-tabs span:hover{background:var(--row)}
  #emo-grid{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px}
  #emo-grid span{font-size:24px;cursor:pointer;padding:3px;border-radius:6px}
  #emo-grid span:hover{background:var(--row)}
  .stg-box{max-height:55vh;overflow-y:auto}
  .av.has-pfp{display:flex}
  .av,.oav{background-size:cover;background-position:center}
  #pfpprev{width:48px;height:48px;border-radius:50%;margin:4px 0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;background-size:cover;background-position:center}
  .goback{display:block;text-align:center;padding:8px;border-radius:8px;background:var(--row);color:var(--text);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:8px}
  .goback:hover{filter:brightness(1.2)}
  .stg-box input[type=checkbox]{width:auto;margin-right:6px;vertical-align:middle}
  #hdr{gap:12px;flex-wrap:wrap}
  #online{display:flex;align-items:center;font-size:12px;color:var(--muted)}
  .oav{position:relative;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;border:2px solid var(--bg);margin-left:-8px}
  .oav:first-child{margin-left:0}
  .oav::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#32d74b;border:2px solid var(--bg)}
  #online .ocount{margin-left:8px}
  .hide-hdr #hdr{display:none}
  .hide-sb #sb{display:none !important}
  #showbars{display:none;position:fixed;top:8px;right:8px;z-index:8;width:34px;height:34px;border-radius:50%;border:none;background:var(--accent);color:var(--on-accent,#fff);font-size:16px;cursor:pointer;opacity:.85}
  .hide-hdr #showbars,.hide-sb #showbars{display:block}
  body[data-theme="tiktok"]{
    --bg:#121212; --side:#000; --line:#2f2f2f; --row:#1f1f1f; --accent:#fe2c55;
    --text:#fff; --muted:#a1a1a5; --input:#2f2f2f; --me:#fe2c55; --peer:#2f2f2f;
  }
  body[data-theme="tiktok"] .row-ch{border-left-color:#25f4ee}
  body[data-theme="tiktok"] .av-sb{background:linear-gradient(135deg,#25f4ee,#fe2c55)}
  body[data-theme="tiktok"] .hdr-sb{text-shadow:2px 2px #25f4ee,-2px -2px #fe2c55}
  body[data-theme="tiktok"] .bubble{border-radius:18px}
  body[data-theme="roblox"]{
    --bg:#232527; --side:#191a1c; --line:#393b3d; --row:#2f3133; --accent:#00a2ff;
    --text:#fff; --muted:#bdbebe; --input:#393b3d; --me:rgba(0,0,0,.45); --peer:rgba(0,0,0,.45);
  }
  body[data-theme="roblox"] .msg,body[data-theme="roblox"] .msg.me{align-self:flex-start;max-width:70%;flex-direction:row}
  body[data-theme="roblox"] .me .col{align-items:flex-start}
  body[data-theme="roblox"] .lbl{color:var(--uc,#00a2ff);font-weight:700;font-size:13px}
  body[data-theme="roblox"] .bubble,body[data-theme="roblox"] .me .bubble{border-radius:6px;padding:5px 10px;font-size:14px;background:rgba(0,0,0,.45);color:#fff}
  body[data-theme="roblox"] .pill{border-radius:6px;border:none}
  body[data-theme="roblox"] .av-sb{border-radius:8px;background:var(--accent)}
  body[data-theme="instagram"]{
    --bg:#000; --side:#000; --line:#262626; --row:#121212; --accent:#0095f6;
    --text:#f5f5f5; --muted:#a8a8a8; --input:#000; --me:linear-gradient(135deg,#3797f0,#8a3ab9); --peer:#262626;
  }
  body[data-theme="instagram"] .bubble{border-radius:22px}
  body[data-theme="instagram"] .pill{border:1px solid #363636;border-radius:22px}
  body[data-theme="instagram"] .av-sb{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
  body[data-theme="instagram"] .row-ch{border-left-color:#d62976}
  body[data-theme="twitter"]{
    --bg:#000; --side:#000; --line:#2f3336; --row:#16181c; --accent:#1d9bf0;
    --text:#e7e9ea; --muted:#71767b; --input:#202327; --me:#1d9bf0; --peer:#2f3336;
  }
  body[data-theme="twitter"] .bubble{border-radius:20px}
  body[data-theme="twitter"] .me .bubble{border-bottom-right-radius:4px}
  body[data-theme="twitter"] .peer .bubble{border-bottom-left-radius:4px}
  body[data-theme="twitter"] .pill{border-radius:20px;border:none}
  body[data-theme="twitter"] .av-sb{background:#1d9bf0}
  #emo-sug{display:none;position:absolute;bottom:62px;left:60px;width:270px;max-height:340px;overflow-y:auto;background:#fff;color:#202124;border-radius:8px;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);padding:6px 0;z-index:7}
  #emo-sug .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px;font-size:11px;letter-spacing:.8px;font-weight:500;color:#5f6368}
  #emo-sug .hd i{font-style:normal;font-size:18px;line-height:1}
  #emo-sug .item{display:flex;gap:12px;align-items:center;padding:8px 16px;font-size:13px;cursor:pointer;color:#3c4043}
  #emo-sug .item .e{font-size:17px;width:20px;text-align:center}
  #emo-sug .item.sel,#emo-sug .item:hover{background:#e8e8e8}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif,"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji";background:var(--bg);color:var(--text);margin:0;display:flex;height:100vh;overflow:hidden}
  #sb{width:220px;background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--line);justify-content:space-between;flex-shrink:0}
  .hdr-sb{padding:20px 16px;font-weight:bold;font-size:20px;border-bottom:1px solid var(--line)}
  .row-ch{padding:12px 16px;background:var(--row);display:flex;align-items:center;gap:10px;border-left:4px solid var(--accent)}
  .av-sb{width:40px;height:40px;border-radius:50%;background:#8e8e93;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff}
  .stg-sb{padding:14px;border-top:1px solid var(--line)}
  .stg-btn{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;font-weight:500}
  .stg-box{display:none;background:var(--row);padding:10px;border-radius:8px;margin-top:6px}
  .stg-box label{font-size:11px;color:var(--muted);display:block;margin:6px 0 2px}
  .stg-box input,.stg-box select{width:100%;padding:6px;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:6px}
  .stg-box button{width:100%;margin-top:8px;background:var(--accent);border:none;color:var(--on-accent,#fff);padding:6px;border-radius:6px;font-weight:bold;cursor:pointer}
  .stg-box .clr-btn{background:none;color:#ff453a;font-size:11px;text-align:left;padding:0;font-weight:normal}
  #main{flex-grow:1;display:flex;flex-direction:column;background:var(--bg);min-width:0}
  #hdr{min-height:55px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center;padding:6px}
  #box{flex-grow:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
  .msg{display:flex;gap:10px;max-width:65%}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.peer{align-self:flex-start}
  .msg.sys{align-self:center;max-width:90%;text-align:center;color:var(--muted);font-size:12px}
  .av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:none;align-items:center;justify-content:center;font-weight:bold;color:#fff}
  .col{display:flex;flex-direction:column;min-width:0}
  .me .col{align-items:flex-end}
  .lbl{font-size:11px;color:var(--muted);margin:0 4px 2px}
  .bubble{padding:10px 16px;border-radius:20px;font-size:15px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
  .me .bubble{background:var(--me);color:var(--on-accent,#fff)}
  .peer .bubble{background:var(--peer)}
  .img{max-width:240px;border-radius:16px;margin-top:4px;display:block}
  .act{display:none;margin-top:4px;gap:8px}
  .msg:hover .act{display:flex}
  .act button{background:none;border:none;color:#ff9f0a;font-size:11px;cursor:pointer;padding:0}
  .act .del{color:#ff453a}
  .edited{font-size:10px;color:var(--muted);font-style:italic}
  #tray{padding:12px 20px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line)}
  .pill{display:flex;flex-grow:1;background:var(--input);border:1px solid var(--line);border-radius:20px;padding:8px 14px}
  #inp{flex-grow:1;background:none;border:none;color:var(--text);outline:none;font-size:15px}
  .plus{font-size:22px;color:var(--accent);cursor:pointer;user-select:none}

  /* Discord theme layout */
  body[data-theme="discord"] .msg,
  body[data-theme="discord"] .msg.me{align-self:stretch;max-width:100%;flex-direction:row}
  body[data-theme="discord"] .me .col{align-items:flex-start}
  body[data-theme="discord"] .av{display:flex}
  body[data-theme="discord"] .lbl{font-size:15px;font-weight:600;color:var(--text);margin:0 0 2px}
  body[data-theme="discord"] .bubble{padding:0;border-radius:0;font-size:15px}
  body[data-theme="discord"] .me .bubble{color:var(--text)}
  body[data-theme="discord"] .pill{border-radius:8px;border:none}
  body[data-theme="discord"] .img{border-radius:6px}
  body[data-theme="discord"] #box{gap:14px}
  body[data-theme="discord"] .av-sb{border-radius:12px;background:var(--accent)}

  /* Room code gate */
  #gate{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;align-items:center;justify-content:center}
  #gate .card{background:var(--side);padding:28px;border-radius:16px;width:min(340px,90vw);display:flex;flex-direction:column;gap:10px;text-align:center}
  #gate h1{margin:0 0 6px;font-size:22px}
  #gate input,#gate select{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:15px}
  #gate button{padding:10px;border:none;border-radius:8px;background:var(--accent);color:var(--on-accent,#fff);font-weight:bold;font-size:15px;cursor:pointer}
  #gerr{color:#ff453a;font-size:13px;min-height:16px}
  #hdr-set{display:none;background:none;border:none;font-size:20px;cursor:pointer;margin-right:10px}
  @media(max-width:600px){#sb{display:none;position:fixed;top:0;bottom:0;left:0;width:240px;z-index:5}#sb.open{display:flex}#hdr-set{display:inline-block}.msg{max-width:85%}}
</style>
</head>
<body data-theme="imessage">

<div id="gate">
  <div class="card">
    <h1>Los-Purebreds-Chat</h1>
    <input id="g-code" type="text" placeholder="Room code" autocomplete="off">
    <input id="g-name" type="text" placeholder="Your name" maxlength="12" autocomplete="off">
    <select id="g-theme"><option value="imessage">iMessage theme</option><option value="discord">Discord theme</option><option value="whatsapp">WhatsApp theme</option><option value="tiktok">TikTok theme</option><option value="roblox">Roblox theme</option><option value="instagram">Instagram theme</option><option value="twitter">Twitter theme</option></select>
    <div id="gerr"></div>
    <button id="g-go">Join</button>
    <a class="goback" href="https://docs.google.com/document/d/1oa90mU-jYczqySulirTvHqqNWTSaNwPGnnArgBdVGrs/edit?tab=t.pqncc0vmsgzp" rel="noopener" style="margin:4px 0 0">← Go back</a>
  </div>
</div>

<div id="sb">
  <div>
    <div class="hdr-sb">Messages</div>
    <div class="row-ch"><div class="av-sb">LP</div><div><b style="font-size:15px">Los Purebreds</b><br><span id="chname" style="font-size:12px;color:var(--muted)">iMessage Channel</span></div></div>
  </div>
  <div class="stg-sb">
    <a class="goback" href="https://docs.google.com/document/d/1oa90mU-jYczqySulirTvHqqNWTSaNwPGnnArgBdVGrs/edit?tab=t.pqncc0vmsgzp" rel="noopener">← Go back</a>
    <div id="youare" style="font-size:12px;color:var(--muted);margin-bottom:6px"></div>
    <button class="stg-btn" id="stg-toggle">⚙️ Settings</button>
    <div class="stg-box" id="sd">
      <label>Name</label><input type="text" id="hi" maxlength="12">
      <label>Message font (everyone sees it)</label><select id="font"></select>
      <label>Profile picture (everyone sees it)</label>
      <div id="pfpprev"></div>
      <button id="pfpbtn" type="button">Choose picture</button><input type="file" id="pfpfile" accept="image/*" style="display:none">
      <button id="pfprm" type="button">Remove picture</button>
      <label><input type="checkbox" id="hh">Hide top bar</label>
      <label><input type="checkbox" id="hs">Hide messages sidebar</label>
      <label>Theme</label>
      <select id="theme"><option value="imessage">iMessage</option><option value="discord">Discord</option><option value="whatsapp">WhatsApp</option><option value="tiktok">TikTok</option><option value="roblox">Roblox</option><option value="instagram">Instagram</option><option value="twitter">Twitter</option></select>
      <label>Wallpaper &amp; accent color</label><input type="color" id="wcol" value="#000000" style="padding:0;height:30px">
      <label>Wallpaper image (stays on this device)</label>
      <button id="wimg" type="button">Choose image</button><input type="file" id="wfile" accept="image/*" style="display:none">
      <label>Image dimming</label><input type="range" id="wdim" min="0" max="80" value="30" style="padding:0">
      <button id="wreset" type="button">Reset wallpaper</button>
      <button id="save">Save</button>
    </div>
  </div>
</div>

<button id="showbars" title="Show bars">☰</button>
<div id="main">
  <div id="hdr"><button id="hdr-set" title="Settings">⚙️</button><span id="status">Not connected</span><div id="online"></div></div>
  <div id="box"></div>
  <div id="tray">
    <label for="fi" class="plus">+</label>
    <input type="file" id="fi" accept="image/*" style="display:none" disabled>
    <span id="emo-btn" title="Emoji">😊</span>
    <div id="emo-panel"></div>
    <div id="emo-sug"></div>
    <div class="pill"><input type="text" id="inp" placeholder="Message" disabled></div>
  </div>
</div>

/* ---------- wallpaper (stored only in this browser) ---------- */
function accentFrom(hex){
  let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const lum = (r, g, b) => (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  while(lum(r, g, b) < 0.25 && (r + g + b) < 765){ r = Math.min(255, r + 25); g = Math.min(255, g + 25); b = Math.min(255, b + 25); } // keep it visible on dark UI
  const toHex = n => n.toString(16).padStart(2, "0");
  return { color: "#" + toHex(r) + toHex(g) + toHex(b), text: lum(r, g, b) > 0.6 ? "#000" : "#fff" };
}
function applyWall(){
  const box = $("box"), k = load("wall_kind", "none"), dim = (+load("wall_dim", "30")) / 100;
  box.style.backgroundImage = ""; box.style.backgroundColor = "";
  $("wdim").value = load("wall_dim", "30"); $("wcol").value = load("wall_color", "#000000");
  const st = document.body.style;
  ["--accent", "--me", "--on-accent"].forEach(v => st.removeProperty(v));
  if(k === "color"){
    const c = load("wall_color", "#000000");
    box.style.backgroundColor = c;
    const a = accentFrom(c);
    st.setProperty("--accent", a.color); st.setProperty("--on-accent", a.text);
    if(document.body.dataset.theme !== "discord") st.setProperty("--me", a.color);
  }
  else if(k === "image"){
    const img = load("wall_img", "");
    if(img){
      box.style.backgroundImage = `linear-gradient(rgba(0,0,0,${dim}),rgba(0,0,0,${dim})),url("${img}")`;
      box.style.backgroundSize = "cover"; box.style.backgroundPosition = "center";
    }
  }
}

$("wfile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const im = new Image();
    im.onload = () => {
      const sc = Math.min(1, 1280 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      try { localStorage.setItem("wall_img", cv.toDataURL("image/jpeg", 0.8)); }
      catch(err){ sys("That image is too big to save as a wallpaper."); return; }
      save("wall_kind", "image"); applyWall();
    };
    im.src = ev.target.result;
  };
  r.readAsDataURL(f); e.target.value = "";
};

/* ---------- networking (host relays to everyone) ---------- */
function setStatus(t){ $("status").textContent = t; }
function ready(){ $("inp").disabled = false; $("fi").disabled = false; }

function connect(){
  setStatus("Connecting..."); renderOnline([me()]);
  peer = new Peer(ROOM_ID);
  peer.on("open", () => {
    isHost = true; ready();
    setStatus("Online (hosting) — waiting for friends");
    sys("You opened the room. Friends can join with the code.");
  });
  peer.on("connection", c => addConn(c));
  peer.on("error", err => {
    if(err.type === "unavailable-id" && !isHost){
      peer = new Peer();
      peer.on("open", () => addConn(peer.connect(ROOM_ID, { reliable: true })));
      peer.on("error", e => setStatus("Connection error: " + e.type));
    } else { setStatus("Connection error: " + err.type); }
  });
}

function addConn(c){
  c.on("open", () => {
    conns.push(c); ready();
    if(!isHost) c.send({ t: "P", u: usr, a: myAvatar, i: newId() });
    setStatus("Online — " + conns.length + " connected");
    sys(isHost ? "A friend joined." : "Connected to the room.");
  });
  c.on("data", d => handle(d, c));
  c.on("close", () => {
    conns = conns.filter(x => x !== c);
    if(isHost) pushRoster(); else renderOnline([me()]);
    setStatus(isHost ? "Online (hosting)" : "Disconnected — refresh to rejoin");
    sys("A friend left.");
  });
}

function send(d, except){ conns.forEach(c => { if(c !== except && c.open) c.send(d); }); }

function validId(i){ return typeof i === "string" && i.length > 0 && i.length < 80; }

function handle(d, from){
  if(!d || typeof d !== "object" || !validId(d.i)) return;
  if(d.t === "P"){ if(isHost && typeof d.u === "string"){ from.userName = d.u.slice(0, 12); from.avatar = okAv(d.a); pushRoster(); } return; }
  if(d.t === "R"){ if(!isHost && Array.isArray(d.list)) renderOnline(d.list.slice(0, 50).filter(x => x && typeof x.n === "string").map(x => ({ n: x.n.slice(0, 12), a: okAv(x.a) }))); return; }
  if(d.t === "T" && typeof d.b === "string" && d.b.length < 2000){
    addMsg(String(d.u).slice(0,12), d.b, "peer", d.i, 0, okFont(d.f));
  } else if(d.t === "M" && typeof d.b === "string" && d.b.startsWith("data:image/")){
    addMsg(String(d.u).slice(0,12), d.b, "peer", d.i, 1);
  } else if(d.t === "N" && typeof d.u === "string" && typeof d.b === "string"){
    sys(d.u.slice(0,12) + " is now " + d.b.slice(0,12));
    if(isHost){ from.userName = d.b.slice(0, 12); pushRoster(); }
  } else if(d.t === "D"){
    const l = logs.find(x => x.i === d.i);
    if(!l || l.cls !== "peer") return;
    removeMsg(d.i);
  } else if(d.t === "V" && typeof d.b === "string" && d.b.length < 2000){
    const l = logs.find(x => x.i === d.i);
    if(!l || l.cls !== "peer" || l.img || l.u !== String(d.u).slice(0,12)) return;
    editMsg(d.i, d.b);
  } else return;
  if(isHost) send(d, from); // relay to the other friends
}

/* ---------- emoji picker (all Unicode emoji) ---------- */
const GROUP_ICONS = { 0:"😀", 1:"👋", 3:"🐶", 4:"🍔", 5:"✈️", 6:"⚽", 7:"💡", 8:"❤️", 9:"🏳️" };
const EMO_LIST = [];
Object.keys(EMO_DATA).forEach(g => EMO_DATA[g].split(";").forEach(row => {
  const [e, n, t] = row.split("|");
  EMO_LIST.push({ e, g, names: n ? n.split(",") : [], tags: t ? t.split(",") : [] });
}));
(function buildPicker(){
  const panel = $("emo-panel");
  const q = document.createElement("input"); q.id = "emo-q"; q.placeholder = "Search emojis"; q.autocomplete = "off";
  const tabs = document.createElement("div"); tabs.id = "emo-tabs";
  const grid = document.createElement("div"); grid.id = "emo-grid";
  panel.append(q, tabs, grid);
  function fill(list){
    grid.innerHTML = "";
    list.forEach(o => {
      const sp = document.createElement("span"); sp.textContent = o.e; sp.title = ":" + (o.names[0] || "") + ":";
      sp.onclick = () => { const i = $("inp"); i.value += o.e; i.focus(); };
      grid.appendChild(sp);
    });
  }
  function show(g){
    [...tabs.children].forEach(t => t.classList.toggle("on", t.dataset.g === String(g)));
    fill(EMO_LIST.filter(o => String(o.g) === String(g))); grid.scrollTop = 0;
  }
  Object.keys(GROUP_ICONS).forEach(g => {
    const t = document.createElement("span"); t.textContent = GROUP_ICONS[g]; t.dataset.g = g; t.onclick = () => { q.value = ""; show(g); };
    tabs.appendChild(t);
  });
  q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-");
    if(!v){ show(0); return; }
    [...tabs.children].forEach(t => t.classList.remove("on"));
    fill(EMO_LIST.filter(o => o.names.some(n => n.includes(v)) || o.tags.some(t => t.includes(v))).slice(0, 200));
  });
  show(0);
})();
$("emo-btn").onclick = () => { const p = $("emo-panel"); p.style.display = p.style.display === "flex" ? "none" : "flex"; };

/* ---------- :shortcodes: like Discord / Google Docs ---------- */
const EMOJI_MAP = {};
("smile=😄 grin=😁 joy=😂 rofl=🤣 smiley=😃 blush=😊 wink=😉 heart_eyes=😍 kissing_heart=😘 sunglasses=😎 thinking=🤔 sweat_smile=😅 cry=😢 sob=😭 angry=😡 rage=🤬 pleading=🥺 sleeping=😴 exploding_head=🤯 partying=🥳 eyeroll=🙄 grimacing=😬 innocent=😇 zany=🤪 smirk=😏 scream=😱 hugging=🤗 neutral=😐 expressionless=😑 sad=😞 worried=😟 confused=😕 upside_down=🙃 nerd=🤓 cold=🥶 hot=🥵 sick=🤢 skull=💀 ghost=👻 clown=🤡 poop=💩 100=💯 fire=🔥 sparkles=✨ tada=🎉 star=⭐ zap=⚡ boom=💥 sweat_drops=💦 " +
"thumbsup=👍 thumbsdown=👎 clap=👏 raised_hands=🙌 pray=🙏 muscle=💪 handshake=🤝 wave=👋 peace=✌️ crossed_fingers=🤞 ok_hand=👌 point_up=☝️ point_right=👉 point_left=👈 fist=✊ eyes=👀 brain=🧠 " +
"heart=❤️ broken_heart=💔 blue_heart=💙 green_heart=💚 purple_heart=💜 yellow_heart=💛 black_heart=🖤 white_heart=🤍 orange_heart=🧡 " +
"dog=🐶 cat=🐱 horse=🐴 unicorn=🦄 monkey=🐵 pig=🐷 frog=🐸 snake=🐍 bear=🐻 lion=🦁 " +
"pizza=🍕 burger=🍔 fries=🍟 taco=🌮 beer=🍺 coffee=☕ cake=🎂 cookie=🍪 apple=🍎 banana=🍌 " +
"soccer=⚽ basketball=🏀 football=🏈 video_game=🎮 music=🎵 guitar=🎸 rocket=🚀 car=🚗 moon=🌙 sun=☀️ rainbow=🌈 snowflake=❄️ money=💰 gift=🎁 crown=👑 trophy=🏆 check=✅ x=❌ warning=⚠️ question=❓ lol=😂 skull_crossbones=☠️ thumbs-up=👍 thumbs-down=👎 slightly-happy=🙂 scrunched-eyes=😣 party-popper=🎉 plus-sign=➕ plus=➕ heart-eyes=😍 raised-hands=🙌").split(" ").forEach(p => {
  const i = p.indexOf("="); if(i > 0) EMOJI_MAP[p.slice(0, i)] = p.slice(i + 1);
});
EMO_LIST.forEach(o => o.names.forEach(n => {
  if(!EMOJI_MAP[n]) EMOJI_MAP[n] = o.e;
  const u = n.replace(/-/g, "_"); if(u !== n && !EMOJI_MAP[u]) EMOJI_MAP[u] = o.e;
}));
function suggest(q){
  const keys = Object.keys(EMOJI_MAP), seen = new Set(), out = [];
  for(const pass of [0, 1]) for(const k of keys){
    if(out.length >= 9) return out;
    if(!(pass === 0 ? k.startsWith(q) : k.includes(q)) || seen.has(EMOJI_MAP[k])) continue;
    seen.add(EMOJI_MAP[k]); out.push(k);
  }
  return out;
}
function replaceCodes(t){ return t.replace(/:([a-z0-9_-]+):/gi, (m, n) => EMOJI_MAP[n.toLowerCase()] || m); }
let sugList = [], sugIdx = 0;
const DEFAULT_SUG = ["thumbs-up","clap","slightly-happy","smile","joy","scrunched-eyes","rage","party-popper","plus-sign"];
function hideSug(){ $("emo-sug").style.display = "none"; sugList = []; }
function highlightSug(){
  [...$("emo-sug").querySelectorAll(".item")].forEach((d, n) => {
    d.classList.toggle("sel", n === sugIdx);
    if(n === sugIdx) d.scrollIntoView({ block: "nearest" });
  });
}
function pickSug(name){
  const el = $("inp"), pos = el.selectionStart, before = el.value.slice(0, pos), after = el.value.slice(pos);
  const nb = before.replace(/(^|\s):[a-z0-9_-]*$/i, (m, a) => a + EMOJI_MAP[name] + " ");
  el.value = nb + after; el.setSelectionRange(nb.length, nb.length); el.focus(); hideSug();
}
function showSug(){
  const el = $("inp"), m = el.value.slice(0, el.selectionStart).match(/(?:^|\s):([a-z0-9_-]*)$/i);
  if(!m){ hideSug(); return; }
  const q = m[1].toLowerCase();
  sugList = q ? suggest(q) : DEFAULT_SUG.slice();
  sugIdx = 0;
  if(!sugList.length){ hideSug(); return; }
  const box = $("emo-sug"); box.innerHTML = "";
  const hd = document.createElement("div"); hd.className = "hd";
  hd.append(document.createTextNode("EMOJIS"));
  const ch = document.createElement("i"); ch.textContent = "›"; hd.appendChild(ch);
  box.appendChild(hd);
  sugList.forEach(k => {
    const d = document.createElement("div"); d.className = "item";
    const e = document.createElement("span"); e.className = "e"; e.textContent = EMOJI_MAP[k];
    const n = document.createElement("span"); n.textContent = ":" + k + ":";
    d.append(e, n);
    d.onmousedown = ev => { ev.preventDefault(); pickSug(k); };
    box.appendChild(d);
  });
  box.style.display = "block"; highlightSug();
}
$("inp").addEventListener("input", () => {
  const el = $("inp"), before = el.value, pos = el.selectionStart, after = replaceCodes(before);
  if(after !== before){ el.value = after; const np = Math.max(0, pos + after.length - before.length); el.setSelectionRange(np, np); }
  showSug();
});
$("inp").addEventListener("keydown", e => {
  if(!sugList.length) return;
  if(e.key === "ArrowDown"){ e.preventDefault(); sugIdx = (sugIdx + 1) % sugList.length; highlightSug(); }
  else if(e.key === "ArrowUp"){ e.preventDefault(); sugIdx = (sugIdx - 1 + sugList.length) % sugList.length; highlightSug(); }
  else if(e.key === "Tab" || e.key === "Enter"){ e.preventDefault(); pickSug(sugList[sugIdx]); }
  else if(e.key === "Escape") hideSug();
});
$("inp").addEventListener("blur", () => setTimeout(hideSug, 120));

/* ---------- sending ---------- */
function newId(){ return "msg-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8); }

function sendText(){
  const el = $("inp"), v = replaceCodes(el.value.trim());
  if(!v) return;
  hideSug();
  const id = newId();
  send({ t: "T", b: v, u: usr, i: id, f: myFont });
  addMsg(usr, v, "me", id, 0, myFont);
  el.value = "";
}
$("inp").addEventListener("keydown", e => { if(e.key === "Enter" && !sugList.length) sendText(); });

$("fi").addEventListener("change", e => {
  const f = e.target.files[0];
  if(!f) return;
  if(f.size > 3 * 1024 * 1024){ sys("Image too big (3MB max)."); e.target.value = ""; return; }
  const r = new FileReader();
  r.onload = evt => {
    const id = newId();
    send({ t: "M", b: evt.target.result, u: usr, i: id });
    addMsg(usr, evt.target.result, "me", id, 1);
    e.target.value = "";
  };
  r.readAsDataURL(f);
});

/* ---------- messages ---------- */
function addMsg(u, b, cls, id, img, f){
  if(logs.some(l => l.i === id)) return;
  logs.push({ u, b, cls, i: id, img, f });
  persist();
  renderRow({ u, b, cls, i: id, img, f });
}

function persist(){
  // keep storage under the browser limit by dropping the oldest messages if needed
  while(true){
    try { localStorage.setItem("chat_history", JSON.stringify(logs)); return; }
    catch(e){ if(logs.length <= 1) return; logs.shift(); }
  }
}

function colorFor(name){
  let h = 0; for(const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return "hsl(" + h + ",55%,50%)";
}

function renderRow(m){
  const box = $("box");
  const w = document.createElement("div");
  w.className = "msg " + m.cls; w.id = m.i;

  const av = document.createElement("div");
  av.className = "av"; w.dataset.user = m.u; paintAv(av, m.u);

  const col = document.createElement("div"); col.className = "col";
  const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = m.u; lbl.style.setProperty("--uc", colorFor(m.u));
  col.appendChild(lbl);

  if(m.img){
    const im = document.createElement("img"); im.className = "img"; im.src = m.b; col.appendChild(im);
  } else {
    const bub = document.createElement("div"); bub.className = "bubble"; bub.textContent = m.b;
    if(m.f && FONT_MAP[m.f]) bub.style.fontFamily = FONT_MAP[m.f];
    bub.dataset.bubble = "1";
    if(m.edited){ const s = document.createElement("span"); s.className = "edited"; s.textContent = " (Edited)"; bub.appendChild(s); }
    col.appendChild(bub);
  }

  const act = document.createElement("div"); act.className = "act";
  if(m.cls === "me" && !m.img){
    const b = document.createElement("button"); b.textContent = "Edit";
    b.onclick = () => {
      const cur = (logs.find(l => l.i === m.i) || m).b;
      const nv = prompt("Edit message:", cur);
      if(nv && nv.trim()){ const fixed = replaceCodes(nv.trim()); send({ t: "V", i: m.i, u: usr, b: fixed }); editMsg(m.i, fixed); }
    };
    act.appendChild(b);
  }
  if(m.cls === "me"){
    const b = document.createElement("button"); b.className = "del"; b.textContent = "Delete";
    b.onclick = () => { send({ t: "D", i: m.i }); removeMsg(m.i); };
    act.appendChild(b);
  }
  col.appendChild(act);

  w.append(av, col);
  box.appendChild(w);
  box.scrollTop = box.scrollHeight;
}

function removeMsg(id){
  const e = $(id); if(e) e.remove();
  logs = logs.filter(l => l.i !== id); persist();
}

function editMsg(id, text){
  logs = logs.map(l => l.i === id ? { ...l, b: text, edited: true } : l); persist();
  const e = $(id); if(!e) return;
  const bub = e.querySelector("[data-bubble]"); if(!bub) return;
  bub.textContent = text;
  const s = document.createElement("span"); s.className = "edited"; s.textContent = " (Edited)";
  bub.appendChild(s);
}

function sys(t){
  const d = document.createElement("div"); d.className = "msg sys"; d.textContent = "System: " + t;
  $("box").appendChild(d); $("box").scrollTop = $("box").scrollHeight;
}
</script>
