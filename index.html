  <script>
    let peerNode = new Peer();
    let currentSessionLink = null;
    let localMessageCounter = 0;

    peerNode.on('open', (assignedId) => {
      const currentUrl = window.location.href.split('?');
      const inviteLink = `${currentUrl[0]}?room=${assignedId}`;
      document.getElementById('my-token-readout').innerHTML = `<strong>Your Instant Invite Link:</strong><br><a href="${inviteLink}" target="_blank" style="color:#5865f2; word-break:break-all;">${inviteLink}</a>`;
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        document.getElementById('peer-id-target').value = roomParam;
        injectSystemBroadcast("Auto-invite detected. Attempting shortcut handshake...");
        setTimeout(() => { initiateHandshakeByToken(roomParam); }, 1500);
      }
    });

    peerNode.on('connection', (inboundLink) => {
      currentSessionLink = inboundLink;
      bindNetworkEvents();
    });

    function initiateHandshake() {
      const pinValue = document.getElementById('peer-id-target').value.trim();
      if (!pinValue) return;
      initiateHandshakeByToken(pinValue);
    }

    function initiateHandshakeByToken(token) {
      currentSessionLink = peerNode.connect(token);
      bindNetworkEvents();
    }

    function bindNetworkEvents() {
      currentSessionLink.on('open', () => {
        document.getElementById('message-input-field').disabled = false;
        document.getElementById('image-file-input').disabled = false;
        document.getElementById('upload-label-element').style.pointerEvents = "auto";
        document.getElementById('upload-label-element').style.opacity = "1";
        document.getElementById('message-input-field').placeholder = "Message #general-chat";
        injectSystemBroadcast("Connection validated. P2P communication stream online.");
      });
      currentSessionLink.on('data', (payload) => {
        if (payload.action === 'CHAT') { renderMessageBlock("Friend", payload.content, "peer", payload.msgId, payload.isImage); }
        else if (payload.action === 'EDIT') { applyRemoteEdit(payload.msgId, payload.content); }
        else if (payload.action === 'DELETE') { applyRemoteDeletion(payload.msgId); }
      });
      currentSessionLink.on('close', () => {
        injectSystemBroadcast("Connection terminated by remote entity.");
        document.getElementById('message-input-field').disabled = true;
      });
    }

    function dispatchMessage() {
      const inputEl = document.getElementById('message-input-field');
      const text = inputEl.value.trim();
      if (!text || !currentSessionLink) return;
      localMessageCounter++;
      const uniqueMsgId = `msg-${peerNode.id}-${localMessageCounter}`;
      currentSessionLink.send({ action: 'CHAT', content: text, msgId: uniqueMsgId, isImage: false });
      renderMessageBlock("You", text, "me", uniqueMsgId, false);
      inputEl.value = "";
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file || !currentSessionLink) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        localMessageCounter++;
        const uniqueMsgId = `msg-${peerNode.id}-${localMessageCounter}`;
        currentSessionLink.send({ action: 'CHAT', content: e.target.result, msgId: uniqueMsgId, isImage: true });
        renderMessageBlock("You", e.target.result, "me", uniqueMsgId, true);
      };
      reader.readAsDataURL(file);
    }

    function renderMessageBlock(sender, text, userClass, id, isImage) {
      const feed = document.getElementById('messages-container');
      const wrap = document.createElement('div');
      wrap.className = 'message-wrapper';
      wrap.id = id;
      const isMe = (userClass === "me");
      let contentHtml = isImage ? `<img src="${text}" class="chat-image" id="body-${id}">` : `<div class="text-body" id="body-${id}">${escapeHtml(text)}</div>`;
      wrap.innerHTML = `
        <div class="avatar ${userClass}">${sender.charAt(0).toUpperCase()}</div>
        <div class="message-content-area">
          <div class="meta-row"><span class="author-name ${userClass}">${sender}</span><span class="timestamp">Today at ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>
          ${contentHtml}
        </div>
        ${isMe ? `<div class="action-overlay">\${!isImage ? `<button class="action-btn" onclick="openInlineEditor('${id}')">Edit</button>` : ''}<button class="action-btn delete-btn" onclick="requestUnsendMessage('\${id}')">Delete</button></div>` : ''}
      `;
      feed.appendChild(wrap);
      feed.scrollTop = feed.scrollHeight;
    }

    function openInlineEditor(id) {
      const textNode = document.getElementById(`body-${id}`);
      if (!textNode || textNode.tagName === 'IMG') return;
      const rawText = textNode.getAttribute("data-raw") || textNode.innerText.replace(" (edited)", "");
      textNode.setAttribute("data-raw", rawText);
      textNode.innerHTML = `<div class="edit-mode-container" id="edit-box-${id}"><input type="text" class="edit-input" id="input-${id}" value="${escapeHtml(rawText)}"><div class="edit-hints">escape to <span onclick="cancelInlineEdit('${id}')">cancel</span> • enter to <span onclick="saveInlineEdit('${id}')">save</span></div></div>`;
      const inputField = document.getElementById(`input-${id}`);
      inputField.focus();
      inputField.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveInlineEdit(id); if (e.key === 'Escape') cancelInlineEdit(id); });
    }

    function saveInlineEdit(id) {
      const inputVal = document.getElementById(`input-${id}`).value.trim();
      if (!inputVal) return;
      currentSessionLink.send({ action: 'EDIT', msgId: id, content: inputVal });
      const textNode = document.getElementById(`body-${id}`);
      textNode.innerHTML = `${escapeHtml(inputVal)}<span class="edited-tag">(edited)</span>`;
      textNode.setAttribute("data-raw", inputVal);
    }

    function cancelInlineEdit(id) {
      const textNode = document.getElementById(`body-${id}`);
      textNode.innerHTML = escapeHtml(textNode.getAttribute("data-raw"));
    }

    function applyRemoteEdit(id, updatedContent) {
      const el = document.getElementById(`body-${id}`);
      if (el && el.tagName !== 'IMG') { el.innerHTML = `${escapeHtml(updatedContent)}<span class="edited-tag">(edited)</span>`; }
    }

    function requestUnsendMessage(id) { currentSessionLink.send({ action: 'DELETE', msgId: id }); applyRemoteDeletion(id); }
    function applyRemoteDeletion(id) { const target = document.getElementById(id); if (target) target.remove(); }
    function injectSystemBroadcast(info) {
      const feed = document.getElementById('messages-container');
      feed.innerHTML += `<div class="message-wrapper"><div class="avatar" style="background:#4e5058;">SYS</div><div class="message-content-area"><div class="meta-row"><span class="author-name" style="color:#b5bac1;">System</span></div><div class="text-body" style="color:#23a55a; font-weight:500;">${info}</div></div></div>`;
      feed.scrollTop = feed.scrollHeight;
    }
    function escapeHtml(str) { return str.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  </script>
</body>
</html>
