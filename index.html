<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Los Purebreds iMessage</title>
  <!-- Loads the peer communication library engine -->
  <script src="https://unpkg.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    
    /* iMessage Sidebar Layout */
    #sidebar { width: 260px; background: #1c1c1e; display: flex; flex-direction: column; border-right: 1px solid #2c2c2e; justify-content: space-between; }
    .sb-header { padding: 20px 16px 10px 16px; font-weight: bold; font-size: 20px; color: #fff; border-bottom: 1px solid #2c2c2e; }
    .chat-row { padding: 12px 16px; background: #2c2c2e; display: flex; align-items: center; gap: 10px; cursor: pointer; border-left: 4px solid #0a84ff; }
    .sb-avatar { width: 44px; height: 44px; border-radius: 50%; background: #8e8e93; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: white; }
    
    /* Bottom Settings Menu Area */
    .sb-settings { padding: 14px 16px; border-top: 1px solid #2c2c2e; background: #1c1c1e; display: flex; flex-direction: column; gap: 8px; }
    .settings-toggle-btn { background: none; border: none; color: #0a84ff; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 0; font-weight: 500; }
    .settings-toggle-btn:hover { text-decoration: underline; }
    .settings-pane { display: none; background: #2c2c2e; padding: 10px; border-radius: 8px; margin-top: 4px; }
    .settings-pane input { width: 85%; padding: 6px; background: #1c1c1e; border: 1px solid #3a3a3c; color: #fff; border-radius: 6px; outline: none; font-size: 13px; text-align: center; }
    .settings-pane button { width: 92%; margin-top: 6px; background: #0a84ff; border: none; color: #fff; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }

    /* Primary iMessage Chat Stage */
    #main-chat { flex-grow: 1; display: flex; flex-direction: column; background: #000; position: relative; }
    #hdr { height: 55px; padding: 0 20px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #2c2c2e; font-size: 13px; color: #8e8e93; text-align: center; }
    #cbtn { background: #32d74b; color: white; border: none; padding: 6px 12px; border-radius: 14px; font-weight: 600; cursor: pointer; font-size: 12px; margin-top: 4px; }
    
    /* iMessage Message Alignment Tunnels */
    #msg-box { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { display: flex; flex-direction: column; max-width: 65%; position: relative; margin-bottom: 4px; }
    
    /* Left / Right Alignment Rules */
    .msg.me { align-self: flex-end; align-items: flex-end; }
    .msg.peer { align-self: flex-start; align-items: flex-start; }
    .msg.sys { align-self: center; max-width: 90%; text-align: center; color: #8e8e93; font-size: 12px; margin: 10px 0; }
    
    .sender-label { font-size: 11px; color: #8e8e93; margin: 0 4px 2px 4px; font-weight: 500; }
    
    /* Apple Bubble Visual Profiles */
    .bubble { padding: 10px 16px; border-radius: 20px; font-size: 15px; line-height: 1.4; position: relative; word-break: break-word; }
    .me .bubble { background: #0a84ff; color: #fff; } /* iMessage Blue */
    .peer .bubble { background: #2c2c2e; color: #fff; } /* iMessage Gray */
    .chat-image { max-width: 240px; border-radius: 16px; margin-top: 4px; display: block; border: 1px solid #2c2c2e; }

    /* Chaotic Vandalism Interactive Bars */
    .chaos-bar { display: none; margin-top: 4px; gap: 8px; }
    .msg:hover .chaos-bar { display: flex; }
    .chaos-btn { background: none; border: none; color: #ff9f0a; font-size: 11px; cursor: pointer; padding: 0; font-weight: 500; }
    .chaos-btn.del-btn { color: #ff453a; }
    .chaos-btn:hover { text-decoration: underline; }
    
    .vandal-edit-box { display: flex; gap: 6px; margin-top: 6px; width: 200px; }
    .vandal-edit-box input { background: #1c1c1e; border: 1px solid #3a3a3c; color: white; padding: 4px 8px; border-radius: 12px; font-size: 13px; flex-grow: 1; outline: none; }
    .vandal-edit-box button { background: #ff9f0a; border: none; color: black; font-weight: bold; border-radius: 12px; padding: 4px 10px; font-size: 12px; cursor: pointer; }

    /* Text Tray Controls */
    #tray { padding: 12px 20px; display: flex; align-items: center; gap: 12px; background: #000; border-top: 1px solid #2c2c2e; }
    .pill-wrapper { display: flex; flex-grow: 1; background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 20px; padding: 6px 14px; align-items: center; gap: 10px; }
    #inp { flex-grow: 1; background: none; border: none; color: #fff; outline: none; font-size: 15px; }
    #inp::placeholder { color: #8e8e93; }
    .upload-glyph { font-size: 22px; color: #0a84ff; cursor: pointer; user-select: none; }
  </style>
</head>
<body>

  <!-- iMessage Left Navigation Sidebar Section -->
  <div id="sidebar">
    <div>
      <div class="sb-header">Messages</div>
      <div class="chat-row">
        <div class="sb-avatar">LP</div>
        <div>
          <div style="font-weight:600; font-size:15px;">Los Purebreds</div>
          <div style="font-size:12px; color:#8e8e93; margin-top:2px;">iMessage Channel</div>
        </div>
      </div>
    </div>
    
    <!-- Permanent Settings Interface Panel Drawer (Bottom Corner) -->
    <div class="sb-settings">
      <button class="settings-toggle-btn" onclick="toggleSettingsPane()">⚙️ Handle Settings</button>
      <div class="settings-pane" id="settings-drawer">
        <input type="text" id="handle-input" placeholder="Change name..." maxlength="12" value="User">
        <button onclick="commitNameChange()">Update Name</button>
      </div>
    </div>
  </div>

  <!-- Primary Main View Frame Stage -->
  <div id="main-chat">
    <div id="hdr">
      <div>
        <div style="font-weight: 600; color: #fff; font-size: 14px;">Los Purebreds Group</div>
        <button id="cbtn" onclick="openNetworkTunnel()">Click to Connect</button>
      </div>
    </div>
    
    <!-- Message Center Box Wireframe -->
    <div id="msg-box">
      <div class="msg sys">System: Hit the green button to initiate the encrypted P2P channel.</div>
    </div>
    
    <!-- Apple Pill-Style Input Box Tray -->
    <div id="tray">
      <label for="img-file-select" class="upload-glyph">+</label>
      <input type="file" id="img-file-select" accept="image/*" onchange="processMediaAttachment(event)" style="display:none;" disabled>
      <div class="pill-wrapper">
        <input type="text" id="inp" placeholder="iMessage" onkeypress="if(event.key==='Enter') sendTextMessage()" disabled>
      </div>
    </div>
  </div>

  <script>
    let peerInstance = null, sessionLink = null, localCounter = 0;
    let handleName = "User";
    const TARGET_ROOM_KEY = "purebred-apple-imessage-tunnel";

    function toggleSettingsPane() {
      let drawer = document.getElementById('settings-drawer');
      drawer.style.display = (drawer.style.display === "block") ? "none" : "block";
    }

    function commitNameChange() {
      let inputVal = document.getElementById('handle-input').value.trim();
      if (!inputVal) return;
      handleName = inputVal;
      injectSystemLog(`Profile identity shifted to "${handleName}".`);
      toggleSettingsPane();
    }

    function openNetworkTunnel() {
      document.getElementById('cbtn').innerText = "Connecting...";
      document.getElementById('cbtn').disabled = true;
      peerInstance = new Peer(TARGET_ROOM_KEY);

      peerInstance.on('open', (id) => {
        injectSystemLog("Awaiting friend connection...");
        sessionLink = peerInstance.connect(TARGET_ROOM_KEY);
        bindPipelineControls();
      });

      peerInstance.on('connection', (inbound) => { sessionLink = inbound; bindPipelineControls(); });
      
      peerInstance.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          peerInstance = new Peer();
          peerInstance.on('open', () => { sessionLink = peerInstance.connect(TARGET_ROOM_KEY); bindPipelineControls(); });
        }
      });
    }

    function bindPipelineControls() {
      sessionLink.on('open', () => {
        document.getElementById('inp').disabled = false;
        document.getElementById('img-file-select').disabled = false;
        document.getElementById('cbtn').style.display = "none";
        document.getElementById('inp').placeholder = "iMessage";
        injectSystemLog("Connected over secure Apple routing servers.");
      });

      sessionLink.on('data', (d) => {
        if (d.type === 'TEXT') appendChatRow(d.username, d.body, "peer", d.msgId, false);
        if (d.type === 'MEDIA') appendChatRow(d.username, d.body, "peer", d.msgId, true);
        if (d.type === 'DELETE') { let target = document.getElementById(d.msgId); if (target) target.remove(); }
        if (d.type === 'VANDAL') {
          let textFrame = document.getElementById(`body-${d.msgId}`);
          if (textFrame) { textFrame.innerHTML = `${escapeHtml(d.body)} <span style="font-size:10px; color:#8e8e93; font-style:italic;">(Edited by friend)</span>`; }
        }
      });
    }

    function sendTextMessage() {
      let box = document.getElementById('inp'), val = box.value.trim();
      if (!val || !sessionLink) return;
      localCounter++; let generatedId = `msg-${peerInstance.id}-${localCounter}`;
      
      sessionLink.send({ type: 'TEXT', body: val, username: handleName, msgId: generatedId });
      appendChatRow(handleName, val, "me", generatedId, false);
      box.value = "";
    }

    function processMediaAttachment(e) {
      let files = e.target.files; if (!files || !sessionLink) return;
      let reader = new FileReader();
      reader.onload = (evt) => {
