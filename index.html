<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue&family=Dancing+Script&family=Lobster&family=Orbitron&family=Pacifico&family=Press+Start+2P&family=Roboto+Mono&display=swap">
<style>
  :root{
    --bg:#000; --side:#1c1c1e; --line:#2c2c2e; --row:#2c2c2e; --accent:#0a84ff;
    --text:#fff; --muted:#8e8e93; --input:#1c1c1e; --me:#0a84ff; --peer:#2c2c2e;
  }
  body[data-theme="discord"]{
    --bg:#313338; --side:#2b2d31; --line:#1f2023; --row:#404249; --accent:#5865f2;
    --text:#dbdee1; --muted:#949ba4; --input:#383a40; --me:transparent; --peer:transparent;
  }
  body[data-theme="whatsapp"]{
    --bg:#0b141a; --side:#111b21; --line:#222d34; --row:#202c33; --accent:#00a884;
    --text:#e9edef; --muted:#8696a0; --input:#2a3942; --me:#005c4b; --peer:#202c33;
  }
  body[data-theme="whatsapp"] .bubble{border-radius:8px;padding:6px 10px}
  body[data-theme="whatsapp"] .pill{border-radius:8px;border:none}
  body[data-theme="whatsapp"] .av-sb{background:var(--accent)}
  #tray{position:relative}
  .stg-box{max-height:55vh;overflow-y:auto}
  .av.has-pfp{display:flex}
  .av,.oav{background-size:cover;background-position:center}
  #pfpprev{width:48px;height:48px;border-radius:50%;margin:4px 0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;background-size:cover;background-position:center}
  .goback{display:block;text-align:center;padding:8px;border-radius:8px;background:var(--row);color:var(--text);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:8px}
  .goback:hover{filter:brightness(1.2)}
  .stg-box input[type=checkbox]{width:auto;margin-right:6px;vertical-align:middle}
  #hdr{gap:12px;flex-wrap:wrap}
  #online{display:flex;align-items:center;font-size:12px;color:var(--bar-text,var(--muted))}
  .oav{position:relative;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;border:2px solid var(--bg);margin-left:-8px}
  .oav:first-child{margin-left:0}
  .oav::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#32d74b;border:2px solid var(--bg)}
  #online .ocount{margin-left:8px}
  .hide-hdr #hdr{display:none}
  #hdrwrap{position:relative;z-index:3}
  .arrow{position:absolute;z-index:8;border:none;background:var(--row);color:var(--text);cursor:pointer;opacity:.65;padding:0;line-height:1;transition:opacity .15s}
  .arrow:hover{opacity:1}
  #hdr-arrow{top:100%;left:50%;transform:translateX(-50%);width:54px;height:16px;border-radius:0 0 10px 10px;font-size:9px}
  #sb-arrow{position:fixed;top:50%;left:220px;transform:translateY(-50%);width:16px;height:54px;border-radius:0 10px 10px 0;font-size:18px}
  .hide-sb #sb-arrow{left:0}
  @media(max-width:600px){#sb-arrow{left:0}#sb.open ~ #sb-arrow{left:240px}}
  .hide-sb #sb{display:none !important}
  body[data-theme="tiktok"]{
    --bg:#121212; --side:#000; --line:#2f2f2f; --row:#1f1f1f; --accent:#fe2c55;
    --text:#fff; --muted:#a1a1a5; --input:#2f2f2f; --me:#fe2c55; --peer:#2f2f2f;
  }
  body[data-theme="tiktok"] .row-ch{border-left-color:#25f4ee}
  body[data-theme="tiktok"] .av-sb{background:linear-gradient(135deg,#25f4ee,#fe2c55)}
  body[data-theme="tiktok"] .hdr-sb{text-shadow:2px 2px #25f4ee,-2px -2px #fe2c55}
  body[data-theme="tiktok"] .bubble{border-radius:18px}
  body[data-theme="roblox"]{
    --bg:#232527; --side:#191a1c; --line:#393b3d; --row:#2f3133; --accent:#00a2ff;
    --text:#fff; --muted:#bdbebe; --input:#393b3d; --me:rgba(0,0,0,.45); --peer:rgba(0,0,0,.45);
  }
  body[data-theme="roblox"] .msg,body[data-theme="roblox"] .msg.me{align-self:flex-start;max-width:70%;flex-direction:row}
  body[data-theme="roblox"] .me .col{align-items:flex-start}
  body[data-theme="roblox"] .lbl{color:var(--uc,#00a2ff);font-weight:700;font-size:13px}
  body[data-theme="roblox"] .bubble,body[data-theme="roblox"] .me .bubble{border-radius:6px;padding:5px 10px;font-size:14px;background:rgba(0,0,0,.45);color:#fff}
  body[data-theme="roblox"] .pill{border-radius:6px;border:none}
  body[data-theme="roblox"] .av-sb{border-radius:8px;background:var(--accent)}
  body[data-theme="instagram"]{
    --bg:#000; --side:#000; --line:#262626; --row:#121212; --accent:#0095f6;
    --text:#f5f5f5; --muted:#a8a8a8; --input:#000; --me:linear-gradient(135deg,#3797f0,#8a3ab9); --peer:#262626;
  }
  body[data-theme="instagram"] .bubble{border-radius:22px}
  body[data-theme="instagram"] .pill{border:1px solid #363636;border-radius:22px}
  body[data-theme="instagram"] .av-sb{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
  body[data-theme="instagram"] .row-ch{border-left-color:#d62976}
  body[data-theme="twitter"]{
    --bg:#000; --side:#000; --line:#2f3336; --row:#16181c; --accent:#1d9bf0;
    --text:#e7e9ea; --muted:#71767b; --input:#202327; --me:#1d9bf0; --peer:#2f3336;
  }
  body[data-theme="twitter"] .bubble{border-radius:20px}
  body[data-theme="twitter"] .me .bubble{border-bottom-right-radius:4px}
  body[data-theme="twitter"] .peer .bubble{border-bottom-left-radius:4px}
  body[data-theme="twitter"] .pill{border-radius:20px;border:none}
  body[data-theme="twitter"] .av-sb{background:#1d9bf0}
  /* Google Docs-style light emoji picker */
  #emo-btn{font-size:22px;cursor:pointer;user-select:none}
  #emo-panel{display:none;flex-direction:column;position:absolute;bottom:62px;left:20px;width:min(352px,92vw);height:380px;background:#fff;color:#202124;border:1px solid #dadce0;border-radius:8px;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);z-index:6;overflow:hidden;font-family:"Google Sans",Roboto,Arial,sans-serif}
  #emo-q{margin:10px 10px 6px;padding:8px 14px;border:1px solid #dadce0;border-radius:20px;font-size:13px;color:#202124;background:#f1f3f4;outline:none;width:auto}
  #emo-q:focus{background:#fff;border-color:#1a73e8}
  #emo-tabs{display:flex;border-bottom:1px solid #dadce0;flex-shrink:0;padding:0 4px}
  #emo-tabs span{flex:1;text-align:center;font-size:18px;padding:6px 0 5px;cursor:pointer;border-bottom:3px solid transparent;opacity:.65}
  #emo-tabs span.on{border-bottom-color:#1a73e8;opacity:1}
  #emo-tabs span:hover{background:#f1f3f4}
  #emo-title{font-size:11px;font-weight:500;color:#5f6368;padding:8px 12px 2px;letter-spacing:.6px;text-transform:uppercase}
  #emo-grid{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;padding:2px 8px}
  #emo-grid span{font-size:22px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:4px}
  #emo-grid span:hover{background:#e8eaed}
  #emo-grid .none{width:100%;padding:20px;text-align:center;font-size:13px;color:#5f6368;cursor:default}
  #emo-foot{border-top:1px solid #dadce0;padding:6px 12px;font-size:12px;color:#5f6368;min-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #emo-sug{display:none;position:absolute;bottom:62px;left:60px;width:min(300px,86vw);max-height:360px;overflow-y:auto;background:#fff;color:#202124;border-radius:8px;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);padding:6px 0;z-index:7;font-family:"Google Sans",Roboto,Arial,sans-serif}
  #emo-sug .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px;font-size:11px;letter-spacing:.8px;font-weight:500;color:#5f6368;position:sticky;top:-6px;background:#fff}
  #emo-sug .hd i{font-style:normal;font-size:18px;line-height:1}
  #emo-sug .item{display:flex;gap:12px;align-items:center;padding:7px 16px;font-size:13px;cursor:pointer;color:#3c4043}
  #emo-sug .item .e{font-size:18px;width:22px;text-align:center}
  #emo-sug .item.sel,#emo-sug .item:hover{background:#e8eaed}
  /* Settings sections */
  details.sec{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--side)}
  details.sec summary{padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text);list-style:none;user-select:none}
  details.sec summary::-webkit-details-marker{display:none}
  details.sec summary::after{content:"▾";float:right;color:var(--muted)}
  details.sec[open] summary::after{content:"▴"}
  details.sec .sec-body{padding:0 12px 12px;border-top:1px solid var(--line)}
  .stg-box button.alt{background:var(--input);color:var(--text);border:1px solid var(--line);font-weight:normal}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif,"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji";background:var(--bg);color:var(--text);margin:0;display:flex;height:100vh;overflow:hidden}
  /* --bar / --bar-text are set by the accent color picker and tint the three bars */
  #sb{width:220px;background:var(--bar,var(--side));display:flex;flex-direction:column;border-right:1px solid var(--line);justify-content:space-between;flex-shrink:0}
  .hdr-sb{padding:20px 16px;font-weight:bold;font-size:20px;border-bottom:1px solid var(--line);color:var(--bar-text,var(--text))}
  .row-ch{padding:12px 16px;background:transparent;color:var(--bar-text,var(--text));display:flex;align-items:center;gap:10px;border-left:4px solid transparent;cursor:pointer;transition:background .12s}
  .row-ch:hover{background:var(--row)}
  .row-ch.active{background:var(--row);color:var(--text);border-left-color:var(--accent)}
  .row-ch:not(.active){border-left-color:transparent !important}
  .row-ch .csub{font-size:12px;color:var(--muted)}
  .av-sb{width:40px;height:40px;border-radius:50%;background:#8e8e93;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff}
  .stg-sb{padding:14px;border-top:1px solid var(--line)}
  .stg-btn{background:none;border:none;color:var(--bar-text,var(--accent));font-size:14px;cursor:pointer;font-weight:500}
  #youare{font-size:12px;color:var(--bar-text,var(--muted));margin-bottom:6px;opacity:.85}
  .stg-box{display:none;background:var(--row);color:var(--text);padding:10px;border-radius:8px;margin-top:6px}
  .stg-box label{font-size:11px;color:var(--muted);display:block;margin:6px 0 2px}
  .stg-box input,.stg-box select{width:100%;padding:6px;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:6px}
  .stg-box button{width:100%;margin-top:8px;background:var(--accent);border:none;color:var(--on-accent,#fff);padding:6px;border-radius:6px;font-weight:bold;cursor:pointer}
  .stg-box .clr-btn{background:none;color:#ff453a;font-size:11px;text-align:left;padding:0;font-weight:normal}
  #main{flex-grow:1;display:flex;flex-direction:column;background:var(--bg);min-width:0}
  #hdr{min-height:55px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:13px;color:var(--bar-text,var(--muted));background:var(--bar,transparent);text-align:center;padding:6px}
  #box{flex-grow:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
  .msg{display:flex;gap:10px;max-width:65%}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.peer{align-self:flex-start}
  .msg.sys{align-self:center;max-width:90%;text-align:center;color:var(--muted);font-size:12px}
  .av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:none;align-items:center;justify-content:center;font-weight:bold;color:#fff}
  .col{display:flex;flex-direction:column;min-width:0}
  .me .col{align-items:flex-end}
  .lbl{font-size:11px;color:var(--muted);margin:0 4px 2px}
  .bwrap{position:relative;max-width:100%;display:flex;align-items:flex-end;gap:6px}
  .bubble{padding:10px 16px;border-radius:20px;font-size:15px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
  .me .bubble{background:var(--me);color:var(--on-accent,#fff)}
  .peer .bubble{background:var(--peer)}
  .img{max-width:240px;border-radius:16px;margin-top:4px;display:block}

  /* Edit / delete: small floating icon pill that appears on hover (or tap on touch screens) */
  .act{position:absolute;top:-14px;display:none;gap:2px;padding:3px;background:var(--side);border:1px solid var(--line);border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.45);z-index:2}
  .me .act{right:6px}
  .peer .act{left:6px}
  body[data-theme="roblox"] .me .act{right:auto;left:6px}
  body[data-theme="discord"] .act{left:auto;right:6px}
  .msg:hover .act,.msg.tap .act,.act:focus-within{display:flex}
  .msg.editing .act{display:none !important}
  .act button{width:26px;height:26px;border:none;border-radius:50%;background:none;color:var(--muted);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
  .act button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .act button:hover{background:var(--row);color:var(--text)}
  .act .del:hover{background:rgba(255,69,58,.18);color:#ff453a}
  .edited{font-size:10px;color:var(--muted);font-style:italic}
  .editin{background:var(--input);color:var(--text);border:1px solid var(--accent);border-radius:14px;padding:8px 14px;font-size:15px;outline:none;width:min(320px,60vw);max-width:100%}
  #tray{padding:12px 20px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);background:var(--bar,transparent)}
  .pill{display:flex;flex-grow:1;background:var(--input);border:1px solid var(--line);border-radius:20px;padding:8px 14px}
  #inp{flex-grow:1;background:none;border:none;color:var(--text);outline:none;font-size:15px}
  .plus{font-size:22px;color:var(--bar-text,var(--accent));cursor:pointer;user-select:none}

  /* Discord theme layout */
  body[data-theme="discord"] .msg,
  body[data-theme="discord"] .msg.me{align-self:stretch;max-width:100%;flex-direction:row}
  body[data-theme="discord"] .me .col{align-items:flex-start}
  body[data-theme="discord"] .av{display:flex}
  body[data-theme="discord"] .lbl{font-size:15px;font-weight:600;color:var(--text);margin:0 0 2px}
  body[data-theme="discord"] .bubble{padding:0;border-radius:0;font-size:15px}
  body[data-theme="discord"] .me .bubble{color:var(--text)}
  body[data-theme="discord"] .pill{border-radius:8px;border:none}
  body[data-theme="discord"] .img{border-radius:6px}
  body[data-theme="discord"] #box{gap:14px}
  body[data-theme="discord"] .av-sb{border-radius:12px;background:var(--accent)}

  #chtabs{display:flex;gap:4px;background:var(--row);padding:3px;border-radius:999px}
  #chtabs button{border:none;background:none;color:var(--text);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  #chtabs button.on{background:var(--accent);color:var(--on-accent,#fff)}

  .av-sb.lp,#gate .logo.lp{background:var(--lp-icon) center/82% no-repeat,#2c2c2e !important;font-size:0;color:transparent}
  .av-sb.lp{border-radius:50%}
  .dev{font-size:10px;font-weight:600;color:var(--muted);margin-left:6px}
  #online{cursor:pointer}
  .oav::before{content:attr(data-dev);position:absolute;top:-8px;left:-5px;font-size:11px;line-height:1;z-index:1}
  #onpop{display:none;position:absolute;top:100%;right:8px;margin-top:4px;min-width:210px;max-height:60vh;overflow-y:auto;background:var(--side);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.5);padding:6px;z-index:9;text-align:left}
  #onpop.open{display:block}
  #onpop .prow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;font-size:13px}
  #onpop .prow:hover{background:var(--row)}
  #onpop .pav{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  #onpop .pnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #onpop .pdev{font-size:11px;color:var(--muted);white-space:nowrap}
  #typing{min-height:22px;padding:2px 20px 4px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px}
  #typing .dots{display:inline-flex;gap:3px;margin-left:2px}
  #typing .dots i{width:4px;height:4px;border-radius:50%;background:var(--muted);animation:tdot 1.2s infinite}
  #typing .dots i:nth-child(2){animation-delay:.2s}
  #typing .dots i:nth-child(3){animation-delay:.4s}
  @keyframes tdot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
  body.in-gal #typing{display:none}
  /* Channels: gallery posts only show in the gallery, chat posts only in chat */
  body:not(.in-gal) .msg[data-ch="gal"]{display:none}
  body.in-gal .msg:not([data-ch="gal"]){display:none}
  body.in-gal #box{flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:16px}
  body.in-gal .msg,body.in-gal .msg.me{align-self:flex-start;max-width:none;flex-direction:row}
  body.in-gal .me .col{align-items:flex-start}
  body.in-gal .img{max-width:min(300px,70vw);max-height:300px;object-fit:cover}
  #galnote{display:none;flex:1;color:var(--bar-text,var(--muted));font-size:14px}
  body.in-gal #galnote{display:block}
  body.in-gal #emo-btn,body.in-gal .pill,body.in-gal #emo-panel,body.in-gal #emo-sug{display:none !important}

  /* Room code gate */
  #gate{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,var(--side),var(--bg) 70%);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
  #gate .card{background:var(--side);padding:32px 28px 24px;border-radius:20px;width:min(360px,100%);display:flex;flex-direction:column;gap:14px;text-align:left;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.45)}
  #gate .logo{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent,#fff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin:0 auto}
  #gate h1{margin:0;font-size:22px;text-align:center}
  #gate .sub{margin:-8px 0 4px;text-align:center;font-size:13px;color:var(--muted)}
  #gate .fld{display:flex;flex-direction:column;gap:5px}
  #gate .fld span{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  #gate input,#gate select{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:15px;outline:none;width:100%;transition:border-color .15s}
  #gate input:focus,#gate select:focus{border-color:var(--accent)}
  #gate button{padding:12px;border:none;border-radius:10px;background:var(--accent);color:var(--on-accent,#fff);font-weight:700;font-size:15px;cursor:pointer;margin-top:2px}
  #gate button:hover{filter:brightness(1.1)}
  #gate .goback{background:none;margin:0;padding:2px;font-size:12px;font-weight:500;color:var(--muted)}
  #gerr{color:#ff453a;font-size:13px;min-height:16px;text-align:center;margin:-6px 0}
  #hdr-set{display:none;background:none;border:none;font-size:20px;cursor:pointer;margin-right:10px}
  @media(max-width:600px){#sb{display:none;position:fixed;top:0;bottom:0;left:0;width:240px;z-index:5}#sb.open{display:flex}#hdr-set{display:inline-block}.msg{max-width:85%}}

  /* sidebar scrolls as a whole, so Settings can always be scrolled to the very bottom */
  #sb{overflow-y:auto;overflow-x:hidden}
  .stg-box{max-height:none;overflow:visible}
  .stg-sb{padding-bottom:28px}
  /* "(edited)" sits beside the bubble, not inside it */
  .me .bwrap{flex-direction:row-reverse}
  body[data-theme="discord"] .me .bwrap,body[data-theme="roblox"] .me .bwrap{flex-direction:row}
  .bwrap > .edited{white-space:nowrap;flex-shrink:0;margin-bottom:3px}

  /* online list in the sidebar + typing dots */
  #sbroster{padding:10px 8px 0;max-height:40vh;overflow-y:auto}
  #sbroster .sbh{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--bar-text,var(--muted));opacity:.8;padding:6px 10px}
  #sbroster .prow,#onpop .prow{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;font-size:13px}
  #sbroster .prow{color:var(--bar-text,var(--text))}
  #sbroster .prow:hover{background:var(--row)}
  #sbroster .pav{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  #sbroster .pnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sbroster .pdev{font-size:11px;opacity:.8;white-space:nowrap}
  .ptyp{display:inline-flex;gap:2px;align-items:center}
  .ptyp i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7;animation:tdot 1.2s infinite}
  .ptyp i:nth-child(2){animation-delay:.2s}
  .ptyp i:nth-child(3){animation-delay:.4s}
  .tav{width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;margin-right:-2px;flex-shrink:0}

  /* ===== iMessage theme = Liquid Glass ===== */
  body[data-theme="imessage"]{
    --bg:#0b0f1e; --side:rgba(255,255,255,.10); --row:rgba(255,255,255,.14); --input:rgba(255,255,255,.12);
    --line:rgba(255,255,255,.20); --peer:rgba(255,255,255,.14); --muted:rgba(255,255,255,.64);
    --lg-bg:radial-gradient(60% 55% at 12% 8%,#3b6dff 0%,transparent 62%),radial-gradient(55% 50% at 92% 18%,#b14dff 0%,transparent 60%),radial-gradient(65% 60% at 75% 100%,#ff6aa5 0%,transparent 62%),radial-gradient(55% 55% at 6% 92%,#22d3c5 0%,transparent 58%),#0b0f1e;
    background:var(--lg-bg); background-attachment:fixed;
  }
  body[data-theme="imessage"] #main{background:transparent}

  /* glass message bubbles with a light sheen on top */

</style>

<script>
/* >>> PASTE YOUR ORIGINAL "const EMO_DATA={...};" LINE OVER THE NEXT LINE <<< */
const EMO_DATA = {};
const ROOM_CODE = "purebred";
const ROOM_ID = "los-purebreds-chat-" + ROOM_CODE;
const $ = id => document.getElementById(id);
let usr = "User", peer = null, conns = [], isHost = false, logs = [];

function load(k, fallback){ try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch(e){ return fallback; } }
function save(k, v){ try { localStorage.setItem(k, v); } catch(e){ console.warn("Storage failed", e); } }

/* permanent per-browser identity + bubble styles */
let uid = load("chat_uid", "");
if(!uid){ uid = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); save("chat_uid", uid); }
const bstyle = {}; let myBc = "", myBi = "";
const okUid = c => typeof c === "string" && /^[A-Za-z0-9_-]{1,40}$/.test(c) && c !== "__proto__";
const okBc = c => typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c) ? c : "";
const okBi = a => typeof a === "string" && a.length < 60000 && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(a) ? a : "";

/* ---------- device (PC / mobile / tablet) ---------- */
const DEVS = { pc: ["💻", "PC"], mobile: ["📱", "Mobile"], tablet: ["📱", "Tablet"] };
const okDev = d => typeof d === "string" && Object.prototype.hasOwnProperty.call(DEVS, d) ? d : "";
function detectDevice(){
  const ua = navigator.userAgent || "", touch = (navigator.maxTouchPoints || 0) > 1;
  if(/iPad|Tablet|PlayBook|Silk/i.test(ua) || (/Macintosh/.test(ua) && touch) || (/Android/i.test(ua) && !/Mobile/i.test(ua))) return "tablet";
  if(/Mobi|iPhone|iPod|Android|Windows Phone/i.test(ua) || (navigator.userAgentData && navigator.userAgentData.mobile)) return "mobile";
  return "pc";
}
const myDevice = detectDevice();

/* ---------- theme ---------- */
function setTheme(t){
  if(!["imessage","discord","whatsapp","tiktok","roblox","instagram","twitter"].includes(t)) t = "imessage";
  document.body.dataset.theme = t;
  $("theme").value = t; $("g-theme").value = t;
  $("chname").textContent = {discord:"# purebred-chat",whatsapp:"WhatsApp Group",tiktok:"TikTok Inbox",roblox:"Roblox Chat",instagram:"Instagram Direct",twitter:"Twitter Messages",imessage:"iMessage Channel"}[t];
  $("inp").placeholder = {discord:"Message #purebred-chat",whatsapp:"Type a message",tiktok:"Send a message...",roblox:"To chat click here or press / key",instagram:"Message...",twitter:"Start a new message",imessage:"iMessage"}[t];
  save("chat_theme", t);
  applyWall();
  restyleAll();
}

/* ---------- wallpaper + accent (stored only in this browser) ---------- */
function accentFrom(hex){
  let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const lum = (r, g, b) => (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  while(lum(r, g, b) < 0.25 && (r + g + b) < 765){ r = Math.min(255, r + 25); g = Math.min(255, g + 25); b = Math.min(255, b + 25); } // keep it visible on dark UI
  const toHex = n => n.toString(16).padStart(2, "0");
  return { color: "#" + toHex(r) + toHex(g) + toHex(b), text: lum(r, g, b) > 0.6 ? "#000" : "#fff" };
}
function applyWall(){
  const box = $("box"), k = load("wall_kind", "none"), dim = (+load("wall_dim", "30")) / 100;
  box.style.backgroundImage = ""; box.style.backgroundColor = "";
  $("wdim").value = load("wall_dim", "30"); $("wcol").value = load("wall_color", "#000000");
  const st = document.body.style;
  ["--accent", "--me", "--on-accent", "--bar", "--bar-text"].forEach(v => st.removeProperty(v));
  if(k === "color"){
    const c = load("wall_color", "#000000");
    box.style.backgroundColor = c;
    const a = accentFrom(c);
    st.setProperty("--accent", a.color); st.setProperty("--on-accent", a.text);
    st.setProperty("--bar", a.color); st.setProperty("--bar-text", a.text);   // top bar, message bar, left bar
    if(document.body.dataset.theme !== "discord") st.setProperty("--me", a.color);
  }
  else if(k === "image"){
    const img = load("wall_img", "");
    if(img){
      box.style.backgroundImage = `linear-gradient(rgba(0,0,0,${dim}),rgba(0,0,0,${dim})),url("${img}")`;
      box.style.backgroundSize = "cover"; box.style.backgroundPosition = "center";
    }
  }
}
$("wcol").oninput = e => { save("wall_kind", "color"); save("wall_color", e.target.value); applyWall(); };
$("wdim").oninput = e => { save("wall_dim", e.target.value); applyWall(); };
$("wimg").onclick = () => $("wfile").click();
$("wfile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const im = new Image();
    im.onload = () => {
      const sc = Math.min(1, 1280 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      try { localStorage.setItem("wall_img", cv.toDataURL("image/jpeg", 0.8)); }
      catch(err){ sys("That image is too big to save as a wallpaper."); return; }
      save("wall_kind", "image"); applyWall();
    };
    im.src = ev.target.result;
  };
  r.readAsDataURL(f); e.target.value = "";
};
$("wreset").onclick = () => { save("wall_kind", "none"); try{ localStorage.removeItem("wall_img"); }catch(e){} applyWall(); };

/* ---------- hide / show bars ---------- */
function applyBars(){
  const h = load("hide_hdr", "0") === "1", sb = load("hide_sb", "0") === "1";
  document.body.classList.toggle("hide-hdr", h); document.body.classList.toggle("hide-sb", sb);
  $("hh").checked = h; $("hs").checked = sb; updateArrows();
}
$("hh").onchange = e => { save("hide_hdr", e.target.checked ? "1" : "0"); applyBars(); };
$("hs").onchange = e => { save("hide_sb", e.target.checked ? "1" : "0"); applyBars(); };
const isMobile = () => window.matchMedia("(max-width:600px)").matches;
function updateArrows(){
  const sbShown = isMobile() ? $("sb").classList.contains("open") : load("hide_sb", "0") !== "1";
  $("sb-arrow").textContent = sbShown ? "‹" : "›";
  $("hdr-arrow").textContent = load("hide_hdr", "0") === "1" ? "▼" : "▲";
}
$("sb-arrow").onclick = () => {
  if(isMobile()) $("sb").classList.toggle("open");
  else { save("hide_sb", load("hide_sb", "0") === "1" ? "0" : "1"); applyBars(); }
};
$("hdr-arrow").onclick = () => { save("hide_hdr", load("hide_hdr", "0") === "1" ? "0" : "1"); applyBars(); };
new MutationObserver(updateArrows).observe($("sb"), { attributes: true });
window.addEventListener("resize", updateArrows);

/* ---------- fonts & profile pictures (shared with everyone) ---------- */
const FONT_MAP = {
  "Arial":"Arial, sans-serif", "Georgia":"Georgia, serif", "Times New Roman":"'Times New Roman', serif",
  "Courier New":"'Courier New', monospace", "Trebuchet MS":"'Trebuchet MS', sans-serif", "Impact":"Impact, sans-serif",
  "Comic Neue":"'Comic Neue', 'Comic Sans MS', cursive", "Pacifico":"Pacifico, cursive", "Lobster":"Lobster, cursive",
  "Dancing Script":"'Dancing Script', cursive", "Bangers":"Bangers, cursive", "Orbitron":"Orbitron, sans-serif",
  "Press Start 2P":"'Press Start 2P', monospace", "Roboto Mono":"'Roboto Mono', monospace"
};
let myFont = "", myAvatar = "";
const avatars = {};
(function(){
  const sel = $("font"), d = document.createElement("option"); d.value = ""; d.textContent = "Default"; sel.appendChild(d);
  Object.keys(FONT_MAP).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = k; o.style.fontFamily = FONT_MAP[k]; sel.appendChild(o); });
})();
function okFont(f){ return typeof f === "string" && Object.prototype.hasOwnProperty.call(FONT_MAP, f) ? f : ""; }
function okAv(a){ return typeof a === "string" && a.length < 30000 && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(a) ? a : ""; }
function paintAv(el, name){
  const a = avatars[name];
  if(a){ el.style.background = 'url("' + a + '") center/cover'; el.textContent = ""; el.classList.add("has-pfp"); }
  else { el.style.background = colorFor(name); el.textContent = (name[0] || "?").toUpperCase(); el.classList.remove("has-pfp"); }
}
function refreshAvatars(){
  document.querySelectorAll(".msg[data-user]").forEach(w => { const a = w.querySelector(".av"); if(a) paintAv(a, w.dataset.user); });
  const pv = $("pfpprev"); paintAv(pv, usr); pv.classList.remove("has-pfp");
}
function cacheAvatars(){ save("chat_avatars", JSON.stringify(avatars)); }
function me(){ return { n: usr, a: myAvatar, d: myDevice }; }
function announce(){ if(isHost) pushRoster(); else send({ t: "P", u: usr, a: myAvatar, d: myDevice, i: newId() }); }
$("pfpbtn").onclick = () => $("pfpfile").click();
$("pfpfile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const im = new Image();
    im.onload = () => {
      const cv = document.createElement("canvas"), n = 80, m = Math.min(im.width, im.height);
      cv.width = cv.height = n;
      cv.getContext("2d").drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, n, n);
      myAvatar = cv.toDataURL("image/jpeg", 0.75); save("chat_pfp", myAvatar);
      avatars[usr] = myAvatar; cacheAvatars(); refreshAvatars(); announce(); sys("Profile picture updated.");
    };
    im.src = ev.target.result;
  };
  r.readAsDataURL(f); e.target.value = "";
};
$("pfprm").onclick = () => { myAvatar = ""; save("chat_pfp", ""); delete avatars[usr]; cacheAvatars(); refreshAvatars(); announce(); };

/* ---------- who's online ---------- */
let lastRoster = [];
function typingNames(){ const now = Date.now(); return Object.keys(typers).filter(n => n !== usr && typers[n] >= now); }
function renderPop(){
  fillRoster($("onpop"));
  const s = $("sbroster"), h = document.createElement("div"), l = document.createElement("div");
  h.className = "sbh"; h.textContent = "Online — " + lastRoster.length;
  fillRoster(l); s.replaceChildren(h, l);
}
function fillRoster(p){
  p.innerHTML = "";
  const tp = typingNames();
  lastRoster.forEach(e => {
    const r = document.createElement("div"); r.className = "prow";
    const av = document.createElement("div"); av.className = "pav"; paintAv(av, e.n);
    const nm = document.createElement("span"); nm.className = "pnm"; nm.textContent = e.n + (e.n === usr ? " (you)" : "");
    r.append(av, nm);
    if(tp.includes(e.n)){ const t = document.createElement("span"); t.className = "ptyp"; t.title = "typing…"; t.innerHTML = "<i></i><i></i><i></i>"; r.appendChild(t); }
    if(e.d && DEVS[e.d]){ const t = document.createElement("span"); t.className = "pdev"; t.textContent = DEVS[e.d][0] + " " + DEVS[e.d][1]; r.appendChild(t); }
    p.appendChild(r);
  });
}
$("online").onclick = () => { $("onpop").classList.toggle("open"); renderPop(); };
document.addEventListener("click", ev => { if(!ev.target.closest("#online") && !ev.target.closest("#onpop")) $("onpop").classList.remove("open"); });
function renderOnline(list){
  list.forEach(e => { if(e.a) avatars[e.n] = e.a; }); cacheAvatars();
  const box = $("online"); box.innerHTML = "";
  list.slice(0, 10).forEach(e => {
    const a = document.createElement("div"); a.className = "oav"; a.title = e.n + (e.d && DEVS[e.d] ? " · " + DEVS[e.d][1] : "");
    a.dataset.dev = e.d && DEVS[e.d] ? DEVS[e.d][0] : ""; paintAv(a, e.n); box.appendChild(a);
  });
  const c = document.createElement("span"); c.className = "ocount";
  c.textContent = list.length + " online" + (list.length > 10 ? " (+" + (list.length - 10) + ")" : "");
  box.appendChild(c);
  lastRoster = list; renderPop();
  refreshAvatars();
}
function pushRoster(){
  if(!isHost) return;
  const list = [me(), ...conns.filter(c => c.userName).map(c => ({ n: c.userName, a: c.avatar || "", d: c.device || "" }))];
  renderOnline(list); send({ t: "R", i: newId(), list });
}

/* ---------- startup ---------- */
window.addEventListener("load", () => {
  usr = load("chat_usr", "User");
  myFont = okFont(load("chat_font", "")); $("font").value = myFont; $("inp").style.fontFamily = FONT_MAP[myFont] || "";
  myAvatar = okAv(load("chat_pfp", ""));
  try { const c = JSON.parse(load("chat_avatars", "{}")); Object.keys(c).forEach(k => { if(okAv(c[k])) avatars[k] = c[k]; }); } catch(e){}
  if(myAvatar) avatars[usr] = myAvatar;
  $("hi").value = usr; $("g-name").value = usr === "User" ? "" : usr; updateYou();
  setTheme(load("chat_theme", "imessage")); applyWall(); applyBars(); refreshAvatars();
  myBc = okBc(load("chat_bc", "")); myBi = okBi(load("chat_bi", ""));
  try { const c = JSON.parse(load("chat_bstyle", "{}")); Object.keys(c).forEach(k => { if(okUid(k) && c[k] && typeof c[k] === "object") bstyle[k] = { bc: okBc(c[k].bc), bi: okBi(c[k].bi), v: +c[k].v || 0 }; }); } catch(e){}
  bstyle[uid] = { bc: myBc, bi: myBi, v: +load("chat_bv", "0") || 0 };
  $("bcol").value = myBc || "#0a84ff";
  try { logs = JSON.parse(load("chat_history", "[]")); } catch(e){ logs = []; }
  logs = logs.filter(l => l && typeof l.i === "string");
  logs.forEach(l => {                      // upgrade old saved messages
    if(!l.ts) l.ts = +String(l.i).split("-")[1] || 0;
    if(!l.v) l.v = l.ts;
    if(!l.c && l.cls === "me") l.c = uid;
    delete l.cls;
  });
  logs.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  rerender();
});

$("g-go").onclick = () => {
  const code = $("g-code").value.trim().toLowerCase();
  if(code !== ROOM_CODE){ $("gerr").textContent = "Wrong room code."; return; }
  const n = $("g-name").value.trim();
  if(n){ usr = n; $("hi").value = n; save("chat_usr", n); updateYou(); }
  setTheme($("g-theme").value);
  rerender();
  $("gate").style.display = "none";
  sys("Welcome to purebred-chat, HM:  RIP: Ryosuke 🕊️🪦🪽");
  connect();
};

/* ---------- networking (host relays to everyone) ---------- */
function setStatus(t){ $("status").textContent = t; }
function ready(){ $("inp").disabled = false; $("fi").disabled = false; }

function connect(){
  setStatus("Connecting..."); renderOnline([me()]);
  peer = new Peer(ROOM_ID);
  peer.on("open", () => {
    isHost = true; ready();
    setStatus("Online (hosting) — waiting for friends");
    sys("You opened the room. Friends can join with the code.");
  });
  peer.on("connection", c => addConn(c));
  peer.on("error", err => {
    if(err.type === "unavailable-id" && !isHost){
      peer = new Peer();
      peer.on("open", () => addConn(peer.connect(ROOM_ID, { reliable: true })));
      peer.on("error", e => setStatus("Connection error: " + e.type));
    } else { setStatus("Connection error: " + err.type); }
  });
}

function addConn(c){
  c.on("open", () => {
    conns.push(c); ready();
    if(!isHost) c.send({ t: "P", u: usr, a: myAvatar, d: myDevice, i: newId() });
    c.send({ t: "S", i: newId(), s: logs.map(l => [l.i, l.v || 0]) });
    c.send({ t: "B", i: newId(), c: uid, bc: myBc, bi: myBi, v: bstyle[uid] ? bstyle[uid].v : 0 });
    setStatus("Online — " + conns.length + " connected");
    sys(isHost ? "A friend joined." : "Connected to the room.");
  });
  c.on("data", d => handle(d, c));
  c.on("close", () => {
    conns = conns.filter(x => x !== c);
    if(isHost) pushRoster(); else renderOnline([me()]);
    setStatus(isHost ? "Online (hosting)" : "Disconnected — refresh to rejoin");
    sys("A friend left.");
  });
}

function send(d, except){ conns.forEach(c => { if(c !== except && c.open) c.send(d); }); }

function validId(i){ return typeof i === "string" && i.length > 0 && i.length < 80; }

function handle(d, from){
  if(!d || typeof d !== "object" || !validId(d.i)) return;
  if(d.t === "P"){ if(isHost && typeof d.u === "string"){ from.userName = d.u.slice(0, 12); from.avatar = okAv(d.a); from.device = okDev(d.d); pushRoster(); } return; }
  if(d.t === "R"){ if(!isHost && Array.isArray(d.list)) renderOnline(d.list.slice(0, 50).filter(x => x && typeof x.n === "string").map(x => ({ n: x.n.slice(0, 12), a: okAv(x.a), d: okDev(x.d) }))); return; }
  if(d.t === "S"){ answerSummary(d, from); return; }
  if(d.t === "Y"){
    const changed = [];
    (Array.isArray(d.e) ? d.e : []).slice(0, 200).forEach(e => { const o = cleanEntry(e); if(o && mergeEntry(o)) changed.push(o); });
    if(d.bs && typeof d.bs === "object") Object.keys(d.bs).forEach(k => { const s = d.bs[k]; if(s && typeof s === "object") setBstyle(k, s.bc, s.bi, s.v); });
    if(changed.length){
      logs.sort((a, b) => (a.ts || 0) - (b.ts || 0)); persist();
      changed.forEach(applyToDom);
      changed.forEach(o => { if(o.u) delete typers[o.u]; }); renderTyping();   // they sent their message, so stop "typing"
      if(isHost) send({ t: "Y", i: newId(), e: changed }, from);
    }
    return;
  }
  if(d.t === "T"){
    if(typeof d.u === "string"){ const n = d.u.slice(0, 12); if(d.s) delete typers[n]; else typers[n] = Date.now() + 5000; renderTyping(); }
    if(isHost) send(d, from);
    return;
  }
  if(d.t === "B"){ if(setBstyle(d.c, d.bc, d.bi, d.v) && isHost) send(d, from); return; }
  if(d.t === "N" && typeof d.u === "string" && typeof d.b === "string"){
    sys(d.u.slice(0,12) + " is now " + d.b.slice(0,12));
    if(isHost){ from.userName = d.b.slice(0, 12); pushRoster(); }
  } else return;
  if(isHost) send(d, from);
}

function cleanEntry(e){
  if(!e || typeof e !== "object" || !validId(e.i)) return null;
  const o = { i: e.i, v: +e.v || 0, ts: +e.ts || 0 };
  if(e.del){ o.del = true; return o; }
  if(typeof e.u !== "string" || typeof e.b !== "string") return null;
  o.u = e.u.slice(0, 12); o.c = okUid(e.c) ? e.c : ""; o.f = okFont(e.f); o.d = okDev(e.d);
  if(e.img){ if(!e.b.startsWith("data:image/") || e.b.length > 4500000) return null; o.img = 1; }
  else if(e.b.length >= 2000) return null;
  o.b = e.b;
  if(e.ch === "gal" && o.img) o.ch = "gal";   // gallery only accepts images
  if(e.edited) o.edited = true;
  return o;
}
function mergeEntry(o){
  const cur = logs.find(l => l.i === o.i);
  if(!cur){ logs.push(o); return true; }
  if(o.v > (cur.v || 0)){ Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, o); return true; }
  return false;
}
function answerSummary(d, from){
  const theirs = new Map();
  (Array.isArray(d.s) ? d.s : []).forEach(p => { if(Array.isArray(p) && typeof p[0] === "string") theirs.set(p[0], +p[1] || 0); });
  if(from.open) from.send({ t: "Y", i: newId(), e: [], bs: bstyle });
  let batch = [], size = 0;
  const flush = () => { if(batch.length && from.open) from.send({ t: "Y", i: newId(), e: batch }); batch = []; size = 0; };
  logs.filter(l => !theirs.has(l.i) || (l.v || 0) > theirs.get(l.i)).forEach(l => {
    const s = (l.b || "").length + 200;
    if(batch.length && (size + s > 400000 || batch.length >= 50)) flush();
    batch.push(l); size += s;
  });
  flush();
}

const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
function addEmo(list, e, g, names, tags){
  names = names.map(n => String(n).toLowerCase()).filter(Boolean);
  list.push({ e, g: String(g), names, tags: (tags || []).map(t => String(t).toLowerCase()) });
  names.forEach(n => {

    const u = n.replace(/-/g, "_"); if(u !== n && !EMOJI_MAP[u]) EMOJI_MAP[u] = e;

}

function quickList(){
  const seen = new Set(), list = [];
  Object.keys(QUICK).forEach(k => { if(!seen.has(QUICK[k])){ seen.add(QUICK[k]); addEmo(list, QUICK[k], 0, [k], []); } });
  return list;
}
// 1) use embedded data if you pasted it, 2) otherwise start with the quick list and download the full set
if(typeof EMO_DATA === "object" && Object.keys(EMO_DATA).length){
  Object.keys(EMO_DATA).forEach(g => EMO_DATA[g].split(";").forEach(row => {
    const [e, n, t] = row.split("|");
    addEmo(EMO_LIST, e, g, n ? n.split(",") : [], t ? t.split(",") : []);
  }));
  emoLoading = false;
} else { EMO_LIST = quickList(); }

async function loadEmojiLib(){
  const base = "https://cdn.jsdelivr.net/npm/emojibase-data@15.3.2/en/";
  try {
    const [dr, sr] = await Promise.all([fetch(base + "data.json"), fetch(base + "shortcodes/github.json").catch(() => null)]);
    if(!dr.ok) throw new Error("emoji data " + dr.status);
    const data = await dr.json();
    let sc = {}; try { if(sr && sr.ok) sc = await sr.json(); } catch(e){}
    const list = [];
    data.forEach(o => {
      if(!o || !o.emoji || o.group === undefined || o.group === 2) return;
      const codes = [].concat(sc[o.hexcode] || []);
      addEmo(list, o.emoji, o.group, [...codes, slug(o.label || "")], o.tags || []);
    });
    if(list.length > 200) EMO_LIST = list;
  } catch(err){ console.warn("Full emoji set unavailable, using quick list", err); }
  emoLoading = false;
  if(window.refreshEmojiPicker) window.refreshEmojiPicker();
}
if(emoLoading) loadEmojiLib();

/* ---------- emoji picker (Google Docs style, light) ---------- */
function insertAtCursor(t){
  const i = $("inp"), s = i.selectionStart == null ? i.value.length : i.selectionStart, e = i.selectionEnd == null ? s : i.selectionEnd;
  i.value = i.value.slice(0, s) + t + i.value.slice(e);
  const p = s + t.length; i.focus(); try { i.setSelectionRange(p, p); } catch(x){}
}
(function buildPicker(){
  const panel = $("emo-panel");
  const q = document.createElement("input"); q.id = "emo-q"; q.placeholder = "Search emojis"; q.autocomplete = "off";
  const tabs = document.createElement("div"); tabs.id = "emo-tabs";
  const title = document.createElement("div"); title.id = "emo-title";
  const grid = document.createElement("div"); grid.id = "emo-grid";
  const foot = document.createElement("div"); foot.id = "emo-foot";
  panel.append(q, tabs, title, grid, foot);
  let cur = "0";
  function fill(list){
    grid.innerHTML = "";
    if(!list.length){ const n = document.createElement("div"); n.className = "none"; n.textContent = emoLoading ? "Loading emojis…" : "No emoji found"; grid.appendChild(n); return; }
    const frag = document.createDocumentFragment();
    list.forEach(o => {
      const sp = document.createElement("span"); sp.textContent = o.e;
      sp.onmouseenter = () => { foot.textContent = o.e + "   :" + (o.names[0] || "") + ":"; };
      sp.onclick = () => insertAtCursor(o.e);
      frag.appendChild(sp);
    });
    grid.appendChild(frag);
  }
  function show(g){
    cur = String(g);
    [...tabs.children].forEach(t => t.classList.toggle("on", t.dataset.g === cur));
    title.textContent = GROUP_NAMES[cur] || "";
    fill(EMO_LIST.filter(o => o.g === cur)); grid.scrollTop = 0;
    foot.textContent = emoLoading ? "Loading all emojis…" : EMO_LIST.length + " emojis";
  }
  Object.keys(GROUP_ICONS).forEach(g => {
    const t = document.createElement("span"); t.textContent = GROUP_ICONS[g]; t.dataset.g = g; t.title = GROUP_NAMES[g];
    t.onclick = () => { q.value = ""; show(g); };
    tabs.appendChild(t);
  });
  function search(){
    const raw = q.value.trim().toLowerCase(), v = slug(raw);
    if(!raw){ show(cur); return; }
    [...tabs.children].forEach(t => t.classList.remove("on"));
    title.textContent = "Results";
    fill(EMO_LIST.filter(o => o.names.some(n => n.includes(v)) || o.tags.some(t => t.includes(raw))).slice(0, 300));
  }
  q.addEventListener("input", search);
  window.refreshEmojiPicker = () => { if(q.value.trim()) search(); else show(cur); };
  show("0");
})();

/* ---------- :shortcodes: popup (searches every emoji name) ---------- */
function suggest(q){
  const keys = Object.keys(EMOJI_MAP), seen = new Set(), out = [];
  for(const pass of [0, 1]) for(const k of keys){
    if(out.length >= 60) return out;
    if(!(pass === 0 ? k.startsWith(q) : k.includes(q)) || seen.has(EMOJI_MAP[k])) continue;
    seen.add(EMOJI_MAP[k]); out.push(k);
  }
  return out;
}
function replaceCodes(t){ return t.replace(/:([a-z0-9_+-]+):/gi, (m, n) => EMOJI_MAP[n.toLowerCase()] || m); }
let sugList = [], sugIdx = 0;
const DEFAULT_SUG = ["thumbs-up","clap","slightly-happy","smile","joy","scrunched-eyes","rage","party-popper","plus-sign"];
function hideSug(){ $("emo-sug").style.display = "none"; sugList = []; }
function highlightSug(){
  [...$("emo-sug").querySelectorAll(".item")].forEach((d, n) => {
    d.classList.toggle("sel", n === sugIdx);
    if(n === sugIdx) d.scrollIntoView({ block: "nearest" });
  });
}
function pickSug(name){
  const el = $("inp"), pos = el.selectionStart, before = el.value.slice(0, pos), after = el.value.slice(pos);
  const nb = before.replace(/(^|\s):[a-z0-9_+-]*$/i, (m, a) => a + EMOJI_MAP[name] + " ");
  el.value = nb + after; el.setSelectionRange(nb.length, nb.length); el.focus(); hideSug();
}
function showSug(){
  const el = $("inp"), m = el.value.slice(0, el.selectionStart).match(/(?:^|\s):([a-z0-9_+-]*)$/i);
  if(!m){ hideSug(); return; }
  const q = m[1].toLowerCase();
  sugList = q ? suggest(q) : DEFAULT_SUG.filter(k => EMOJI_MAP[k]);
  sugIdx = 0;
  if(!sugList.length){ hideSug(); return; }
  const box = $("emo-sug"); box.innerHTML = "";
  const hd = document.createElement("div"); hd.className = "hd";
  hd.append(document.createTextNode("EMOJIS"));
  const ch = document.createElement("i"); ch.textContent = "›"; hd.appendChild(ch);
  box.appendChild(hd);
  sugList.forEach(k => {
    const d = document.createElement("div"); d.className = "item";
    const e = document.createElement("span"); e.className = "e"; e.textContent = EMOJI_MAP[k];
    const n = document.createElement("span"); n.textContent = ":" + k + ":";
    d.append(e, n);
    d.onmousedown = ev => { ev.preventDefault(); pickSug(k); };
    box.appendChild(d);
  });
  box.style.display = "block"; highlightSug();
}
$("inp").addEventListener("input", () => {
  const el = $("inp"), before = el.value, pos = el.selectionStart, after = replaceCodes(before);
  if(after !== before){ el.value = after; const np = Math.max(0, pos + after.length - before.length); el.setSelectionRange(np, np); }
  showSug();
});
$("inp").addEventListener("keydown", e => {
  if(!sugList.length) return;
  if(e.key === "ArrowDown"){ e.preventDefault(); sugIdx = (sugIdx + 1) % sugList.length; highlightSug(); }
  else if(e.key === "ArrowUp"){ e.preventDefault(); sugIdx = (sugIdx - 1 + sugList.length) % sugList.length; highlightSug(); }
  else if(e.key === "Tab" || e.key === "Enter"){ e.preventDefault(); pickSug(sugList[sugIdx]); }
  else if(e.key === "Escape") hideSug();
});
$("inp").addEventListener("blur", () => setTimeout(hideSug, 120));

/* ---------- typing indicator ---------- */
const typers = {};
let lastTyped = 0, lastTypeKey = "";
function renderTyping(){
  const now = Date.now();
  Object.keys(typers).forEach(k => { if(typers[k] < now) delete typers[k]; });
  const names = Object.keys(typers).filter(n => n !== usr), el = $("typing");
  const key = names.join("|"); if(key !== lastTypeKey){ lastTypeKey = key; renderPop(); }   // keep the Online lists in sync
  if(!names.length){ el.replaceChildren(); return; }
  const txt = names.length === 1 ? names[0] + " is typing"
    : names.length === 2 ? names[0] + " and " + names[1] + " are typing"
    : names.length === 3 ? names[0] + ", " + names[1] + " and " + names[2] + " are typing"
    : "Several people are typing";
  const s = document.createElement("span"); s.textContent = txt;
  const dots = document.createElement("span"); dots.className = "dots"; dots.innerHTML = "<i></i><i></i><i></i>";
  const avs = names.slice(0, 3).map(n => { const a = document.createElement("div"); a.className = "tav"; paintAv(a, n); return a; });
  el.replaceChildren(...avs, s, dots);
}
setInterval(renderTyping, 1000);
$("inp").addEventListener("input", () => {
  if(curCh === "gal") return;
  if($("inp").value.trim()){
    if(Date.now() - lastTyped > 2500){ lastTyped = Date.now(); send({ t: "T", u: usr, i: newId() }); }
  } else if(lastTyped){ lastTyped = 0; send({ t: "T", u: usr, s: 1, i: newId() }); }
});

function postMsg(b, img){
  const now = Date.now(), o = { i: newId(), u: usr, c: uid, b, ts: now, v: now, d: myDevice };
  if(img){ o.img = 1; if(curCh === "gal") o.ch = "gal"; } else o.f = myFont;
  logs.push(o); persist(); renderRow(o);

}

  const el = $("inp"), v = replaceCodes(el.value.trim());

function shrinkImage(url, cb){
  const im = new Image();
  im.onload = () => {
    const sc = Math.min(1, 1024 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
    cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL("image/jpeg", 0.75));
  };
  im.onerror = () => cb(url);
  im.src = url;
}
$("fi").addEventListener("change", e => {
  const f = e.target.files[0];
  if(!f) return;
  if(f.size > 10 * 1024 * 1024){ sys("Image too big (10MB max)."); e.target.value = ""; return; }
  const r = new FileReader();
  r.onload = evt => shrinkImage(evt.target.result, d => postMsg(d, 1));
  r.readAsDataURL(f); e.target.value = "";
});

/* ---------- messages ---------- */
function persist(){
  // keep storage under the browser limit by dropping the oldest messages if needed
  while(true){
    try { localStorage.setItem("chat_history", JSON.stringify(logs)); return; }
    catch(e){ if(logs.length <= 1) return; logs.shift(); }
  }
}

function colorFor(name){
  let h = 0; for(const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return "hsl(" + h + ",55%,50%)";
}

const isMine = m => (m.c && m.c === uid) || m.u === usr;

const ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_DEL = '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
function iconBtn(cls, title, svg, fn){
  const b = document.createElement("button"); b.type = "button"; b.className = cls; b.title = title; b.setAttribute("aria-label", title);
  b.innerHTML = svg; b.onclick = ev => { ev.stopPropagation(); fn(); }; return b;
}
function editedText(l){ return " (edited)"; }

/* inline editing: works on ANY text message, yours or a friend's */
function startEdit(id){
  const l = logs.find(x => x.i === id), w = $(id);
  if(!l || l.img || l.del || !w) return;
  const bub = w.querySelector("[data-bubble]"); if(!bub || w.classList.contains("editing")) return;
  const inp = document.createElement("input");
  inp.type = "text"; inp.className = "editin"; inp.value = l.b; inp.maxLength = 1999;
  if(l.f && FONT_MAP[l.f]) inp.style.fontFamily = FONT_MAP[l.f];
  w.classList.add("editing"); w.classList.remove("tap");
  bub.style.display = "none"; bub.parentNode.insertBefore(inp, bub);
  let done = false;
  const finish = ok => {
    if(done) return; done = true;
    const nv = replaceCodes(inp.value.trim());
    inp.remove(); bub.style.display = ""; w.classList.remove("editing");
    if(ok && nv && nv !== l.b){
      l.b = nv; l.edited = true; l.v = Date.now();
      persist(); applyToDom(l); send({ t: "Y", i: newId(), e: [l] });
    }
  };
  inp.addEventListener("keydown", e => { if(e.key === "Enter") finish(true); else if(e.key === "Escape") finish(false); });
  inp.addEventListener("blur", () => finish(true));
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
}
function deleteMsg(id){
  const l = logs.find(x => x.i === id); if(!l) return;
  Object.keys(l).forEach(k => { if(k !== "i" && k !== "ts") delete l[k]; });
  l.del = true; l.v = Date.now(); persist(); applyToDom(l); send({ t: "Y", i: newId(), e: [l] });
}

function setEditedTag(wrap, on){
  let t = wrap.querySelector(":scope > .edited");
  if(!on){ if(t) t.remove(); return; }
  if(!t){ t = document.createElement("span"); t.className = "edited"; t.textContent = "(edited)"; wrap.insertBefore(t, wrap.querySelector(":scope > .act")); }
}

function renderRow(m){
  if(m.del) return;
  const box = $("box"), mine = isMine(m);
  const w = document.createElement("div");
  w.className = "msg " + (mine ? "me" : "peer"); w.id = m.i;
  w.dataset.ts = m.ts || 0; w.dataset.uid = m.c || ""; w.dataset.user = m.u; w.dataset.ch = m.ch || "";

  const av = document.createElement("div"); av.className = "av"; paintAv(av, m.u);
  const col = document.createElement("div"); col.className = "col";
  const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = m.u; lbl.style.setProperty("--uc", colorFor(m.u));
  const dv = DEVS[m.d];
  if(dv){ const t = document.createElement("span"); t.className = "dev"; t.textContent = dv[0] + " " + dv[1]; lbl.appendChild(t); }
  col.appendChild(lbl);

  const wrap = document.createElement("div"); wrap.className = "bwrap";
  if(m.img){
    const im = document.createElement("img"); im.className = "img"; im.src = m.b; wrap.appendChild(im);
  } else {
    const bub = document.createElement("div"); bub.className = "bubble"; bub.textContent = m.b;
    if(m.f && FONT_MAP[m.f]) bub.style.fontFamily = FONT_MAP[m.f];
    bub.dataset.bubble = "1";
    styleBubble(bub, m.c || "");
    wrap.appendChild(bub);
    if(m.edited) setEditedTag(wrap, true);
  }

  const act = document.createElement("div"); act.className = "act";
  if(!m.img) act.appendChild(iconBtn("edt", "Edit message", ICON_EDIT, () => startEdit(m.i)));
  if(mine) act.appendChild(iconBtn("del", "Delete message", ICON_DEL, () => deleteMsg(m.i)));
  if(act.children.length) wrap.appendChild(act);
  col.appendChild(wrap);
  w.append(av, col);

  // tap a message to show its buttons on touch screens
  w.addEventListener("click", ev => {
    if(ev.target.closest(".act") || ev.target.closest(".editin")) return;
    document.querySelectorAll(".msg.tap").forEach(x => { if(x !== w) x.classList.remove("tap"); });
    w.classList.toggle("tap");
  });

  const nxt = m.ts ? [...box.querySelectorAll(".msg[data-ts]")].find(r => +r.dataset.ts > m.ts) : null;
  if(nxt) box.insertBefore(w, nxt); else { box.appendChild(w); box.scrollTop = box.scrollHeight; }
}

function applyToDom(l){
  const e = $(l.i);
  if(l.del){ if(e) e.remove(); return; }
  if(!e){ renderRow(l); return; }
  const bub = e.querySelector("[data-bubble]"); if(!bub || l.img) return;
  bub.textContent = l.b;
  if(l.edited) setEditedTag(bub.parentNode, true);
}
function rerender(){
  document.querySelectorAll("#box .msg[data-ts]").forEach(e => e.remove());
  logs.forEach(renderRow);
}

/* ---------- bubble color / image ---------- */
function textOn(hex){
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.6 ? "#000" : "#fff";
}
function styleBubble(bub, c){
  const s = bstyle[c];
  bub.style.backgroundColor = ""; bub.style.backgroundImage = ""; bub.style.color = "";
  bub.style.textShadow = ""; bub.style.padding = ""; bub.style.borderRadius = "";
  if(!s || (!s.bc && !s.bi)) return;
  if(document.body.dataset.theme === "discord"){ bub.style.padding = "4px 10px"; bub.style.borderRadius = "8px"; }
  if(s.bi){
    bub.style.backgroundImage = 'url("' + s.bi + '")'; bub.style.backgroundSize = "cover"; bub.style.backgroundPosition = "center";
    bub.style.color = "#fff"; bub.style.textShadow = "0 1px 3px rgba(0,0,0,.9)";
  } else { bub.style.backgroundColor = s.bc; bub.style.color = textOn(s.bc); }
}
function restyleAll(){
  document.querySelectorAll(".msg[data-uid]").forEach(w => { const b = w.querySelector("[data-bubble]"); if(b) styleBubble(b, w.dataset.uid); });
}
function cacheB(){ save("chat_bstyle", JSON.stringify(bstyle)); }
function setBstyle(c, bc, bi, v){
  if(!okUid(c) || c === uid) return false;
  v = +v || 0;
  if(bstyle[c] && (bstyle[c].v || 0) >= v) return false;
  bstyle[c] = { bc: okBc(bc), bi: okBi(bi), v };
  cacheB(); restyleAll(); return true;
}
function setMyStyle(){
  const v = Date.now(); save("chat_bv", String(v));
  bstyle[uid] = { bc: myBc, bi: myBi, v }; cacheB(); restyleAll();
  send({ t: "B", i: newId(), c: uid, bc: myBc, bi: myBi, v });
}
$("bcol").onchange = e => { myBc = e.target.value; save("chat_bc", myBc); setMyStyle(); };
$("bcolrm").onclick = () => { myBc = ""; save("chat_bc", ""); $("bcol").value = "#0a84ff"; setMyStyle(); };
$("bimgbtn").onclick = () => $("bimgfile").click();
$("bimgrm").onclick = () => { myBi = ""; save("chat_bi", ""); setMyStyle(); };
$("bimgfile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const im = new Image();
    im.onload = () => {
      const sc = Math.min(1, 240 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(im.width * sc)); cv.height = Math.max(1, Math.round(im.height * sc));
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      myBi = cv.toDataURL("image/jpeg", 0.6); save("chat_bi", myBi); setMyStyle(); sys("Bubble image updated.");
    };
    im.src = ev.target.result;
  };
  r.readAsDataURL(f); e.target.value = "";
};

function sys(t){
  const d = document.createElement("div"); d.className = "msg sys"; d.textContent = "System: " + t;
  $("box").appendChild(d); $("box").scrollTop = $("box").scrollHeight;
}
</script>
</body>
