<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Los Purebreds Chat</title>
<script src="https://unpkg.com"></script>
<style>
  body{font-family:sans-serif;background:#313338;color:#dbdee1;margin:0;display:flex;height:100vh;}
  #sb{width:200px;background:#2b2d31;padding:12px;font-weight:bold;color:#fff;}
  #main{flex-grow:1;display:flex;flex-direction:column;background:#313338;}
  #hdr{height:48px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid #1f2023;font-weight:bold;color:#fff;}
  #msg-box{flex-grow:1;overflow-y:auto;padding:16px;}
  .msg{display:flex;margin-bottom:12px;gap:12px;position:relative;}
  .avatar{width:36px;height:36px;border-radius:50%;background:#5865f2;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;}
  .avatar.peer{background:#23a55a;}
  .img{max-width:250px;border-radius:6px;margin-top:6px;display:block;}
  .del-btn{position:absolute;right:10px;background:#f23f43;color:#fff;border:none;border-radius:4px;padding:2px 6px;cursor:pointer;display:none;}
  .msg:hover .del-btn{display:block;}
  #tray{padding:20px;display:flex;align-items:center;gap:12px;background:#383a40;margin:16px;border-radius:8px;}
  #inp{flex-grow:1;background:none;border:none;color:#dbdee1;outline:none;font-size:15px;}
  .btn{background:#23a55a;color:#fff;border:none;padding:8px 16px;border-radius:4px;font-weight:bold;cursor:pointer;}
</style></head><body>
  <div id="sb">Los Purebreds<div style="color:#949ba4;margin-top:12px;font-size:14px;"># general-chat</div></div>
  <div id="main">
    <div id="hdr"># general-chat <button class="btn" id="cbtn" onclick="init()" style="margin-left:auto;">Connect</button></div>
    <div id="msg-box"><div class="msg"><div class="avatar">SYS</div><div><b>System</b><br><i style="color:#bcbec4;">Click "Connect" to log into the purebred line.</i></div></div></div>
    <div id="tray">
      <label for="f" style="font-size:20px;cursor:pointer;color:#b5bac1;user-select:none;">+</label>
      <input type="file" id="f" accept="image/*" onchange="upImg(event)" style="display:none;" disabled>
      <input type="text" id="inp" placeholder="Awaiting connection..." onkeypress="if(event.key==='Enter') sendTxt()" disabled>
    </div>
  </div>
<script>
  let p=null,c=null,cnt=0,rm="purebred";
  function init(){
    document.getElementById('cbtn').innerText="Connecting...";
    p=new Peer(rm);
    p.on('open',()=>{log("Room hosting active. Waiting for friend...","#23a55a");c=p.connect(rm);events();});
    p.on('connection',(l)=>{c=l;events();});
    p.on('error',(e)=>{if(e.type==='unavailable-id'){p=new Peer();p.on('open',()=>{c=p.connect(rm);events();});}});
  }
  function events(){
    c.on('open',()=>{
      document.getElementById('inp').disabled=false;document.getElementById('f').disabled=false;
      document.getElementById('inp').placeholder="Message #general-chat";document.getElementById('cbtn').style.display="none";
      log("Secure pipeline connected!","#23a55a");
    });
    c.on('data',(d)=>{if(d.a==='C')add("Friend",d.c,"peer",d.i,d.m);if(d.a==='D'){let e=document.getElementById(d.i);if(e)e.remove();}});
  }
  function sendTxt(){
    let e=document.getElementById('inp'),v=e.value.trim();if(!v||!c)return;
    cnt++;let id=`m-${cnt}`;c.send({a:'C',c:v,i:id,m:0});add("You",v,"me",id,0);e.value="";
  }
  function upImg(e){
    let f=e.target.files[0];if(!f||!c)return;let r=new FileReader();
    r.onload=(evt)=>{cnt++;let id=`m-${cnt}`;c.send({a:'C',c:evt.target.result,i:id,m:1});add("You",evt.target.result,"me",id,1);};
    r.readAsDataURL(f);
  }
  function add(s,t,cls,id,img){
    let b=document.getElementById('msg-box'),w=document.createElement('div');w.className='msg';w.id=id;
    let html=img?`<img src="${t}" class="img">`:`<span style="color:#dbdee1;">${escape(t)}</span>`;
    w.innerHTML=`<div class="avatar ${cls}">${s[0]}</div><div><b>${s}</b><br>${html}</div>`;
    if(cls==='me')w.innerHTML+=`<button class="del-btn" onclick="c.send({a:'D',i:'${id}'});document.getElementById('${id}').remove()">Delete</button>`;
    b.appendChild(w);b.scrollTop=b.scrollHeight;
  }
  function log(txt,color){
    let b=document.getElementById('msg-box');
    b.innerHTML+=`<div class="msg"><div class="avatar" style="background:#4e5058;">SYS</div><div><b>System</b><br><span style="color:${color}; font-weight:bold;">${txt}</span></div></div>`;
    b.scrollTop=b.scrollHeight;
  }
  function escape(str){return str.toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script></body></html>
